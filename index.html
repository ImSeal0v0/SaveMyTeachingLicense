ACH.slayer={n:'清理门户',d:'亲手斩杀叛离的弟子'};
// ================= 叛徒的战斗 =================
const isRogue=d=>['nemesis','demon'].includes(d.status)||(d.status==='expelled'&&d.demon>=60);
// 玩家与叛徒交手：返回 'win' | 'flee' | 'lose'；玩家死亡时直接进入结局
function duel(d){const p=powCheck(pPower(),dPower(d));if(chance(p)){hurtP(ri(5,20),d);if(G.over)return'dead';if(chance(.7)){killD(d,'死于师尊剑下。');unlock('slayer');return'win'}d.realm=Math.max(0,d.realm-1);d.demon+=5;clampD(d);logD(d,'被师尊重创，狼狈遁走。');return'flee'}
  hurtP(ri(35,70),d);if(G.over)return'dead';return'lose'}
function duelText(r,d){return r==='win'?'剑光落下，恩怨两清。你在{d}的尸身旁站了很久。':r==='flee'?'{d}被你重创，化作一道血光遁走了。':'你负了重伤，{d}却没有再补上一剑，只是深深看了你一眼，走了。'}
// 叛徒袭击同门：返回描述
function rogueHitsDisciple(x,y){const p=powCheck(dPower(y),dPower(x));const r=R();
  if(r<p){if(chance(.25)){killD(x,`被${y.name}所杀。`);y.mood-=10;clampD(y);logD(y,`击杀了叛离师门的${x.name}。`);return `${y.name}拼死反击，竟将{d}斩杀。`}hurtD(x,ri(20,40));logD(y,`击退了来袭的${x.name}。`);return `${y.name}击退了{d}，{d}负伤而逃。`}
  if(chance(.35)){hurtD(y,ri(15,30));if(y.status==='home')logD(y,`被${x.name}袭击，侥幸逃脱。`);return `${y.name}不敌，拼命逃回了洞府，身上带着伤。`}
  hurtD(y,ri(45,95));if(y.status==='dead')return `<b style="color:var(--cinnabar)">${y.name}死在了{d}手里。</b>`;logD(y,`被${x.name}重创。`);return `${y.name}被{d}重伤，气血只剩${Math.round(hpPct(y)*100)}%。`}
function rogueMonth(d){if(!isRogue(d)||G.queue.some(e=>e.id===d.id))return;const hate=d.love<50;
  if(hate&&d.demon>=50&&chance(.06)){const tg=presentDs().filter(x=>!x.child||x.age>=6);G.queue.push({k:'raid',id:d.id,tid:tg.length&&chance(.6)?pick(tg).id:null})}
  else if(!hate&&chance(.05)){G.queue.push({k:'mischief',id:d.id})}}
EV.raid=e=>{const d=getD(e.id);if(!d||!isRogue(d))return nextEvent();const y=e.tid?getD(e.tid):null;
  if(y&&y.status==='home'){evModal('寻仇',`<p class="prose">${d.status==='demon'?'魔气翻涌。':''}${d.name}回来了。${TA(d)}在后山截住了${y.name}，剑已出鞘：“师尊欠我的，就先从你身上讨。”</p><p class="hint">${d.name}战力 ${dPower(d)}　·　${y.name}战力 ${dPower(y)}　·　你的战力 ${pPower()}</p>`,[
    opt('亲自出手',()=>{const r=duel(d);if(r==='dead')return;let t=duelText(r,d);if(r==='lose'){t+='<br>'+rogueHitsDisciple(d,y)}else{y.favor+=8;clampD(y)}result(t,d)},false,'pri'),
    opt(`让${y.name}自己应对`,()=>result(rogueHitsDisciple(d,y),d)),
    opt('以旧日情分喝止',()=>{if(chance(clamp((d.favor+d.love)/180,.05,.6))){d.demon-=10;clampD(d);result('{d}的剑停在半空。良久，{ta}收剑走了。',d)}else result('“情分？”{d}冷笑。<br>'+rogueHitsDisciple(d,y),d)})])}
  else{evModal('寻仇',`<p class="prose">${d.name}立在${G.cave}外，${d.status==='demon'?'魔气遮天':'杀气凛然'}：“{s}，出来受死。”</p><p class="hint">${d.name}战力 ${dPower(d)}　·　你的战力 ${pPower()}</p>`.replace('{s}','师尊'),[
    opt('迎战',()=>{const r=duel(d);if(r==='dead')return;result(duelText(r,d),d)},false,'pri'),
    opt('闭门不出',()=>{const loss=Math.min(G.p.jade,ri(50,200));G.p.jade-=loss;G.p.kpi-=10;const vs=presentDs();let t=`{d}在山门外砸了一夜，毁了你的灵田和药圃（灵玉 -${loss}，宗门KPI -10）。`;if(vs.length&&chance(.4)){t+='<br>'+rogueHitsDisciple(d,pick(vs))}result(t,d)}),
    opt('遁走避其锋芒',()=>{hurtP(10,d);if(G.over)return;result('你连夜离开了洞府。{d}扑了个空，留下满地狼藉。',d)})])}};
const MISCHIEF=[
  d=>{const k=G.bag.length?pick(G.bag).k:null;if(k){removeItem(G.bag,k);return `你的乾坤囊里少了一件${itemInfo(k).name}。窗台上留着一片{d}惯用的剑穗。`}return '{d}夜里潜进洞府，什么都没拿，只在你枕边放了一枝花。'},
  d=>{G.p.kpi-=15;return '宗门里传开了一些关于你和{d}的流言，说得有鼻子有眼。（宗门KPI -15）'},
  d=>{const top=aliveDs().filter(x=>x.status==='home'&&x.age>=18&&!x.child).sort((a,b)=>b.crush-a.crush)[0];if(top){const t=rogueHitsDisciple(d,top);return `{d}盯上了你最在意的${top.name}：“凭什么是{ta2}？”<br>`+t}return '{d}在你的洞府外站了一夜，天亮前走了。'},
  d=>{const v=presentDs();if(v.length){const y=pick(v);y.demon=clamp(y.demon+15,0,100);logD(y,`被${d.name}找上，说了很多师尊的坏话。`);return `{d}偷偷找上了${y.name}，说了一夜你的坏话。${y.name}回来后，看你的眼神有点不对。`}return '{d}托人给你带了一句话：“我会回来的。”'},
  d=>{addHeart(4,d);return '{d}深夜出现在你窗外，隔着窗纸唤了你一声“师尊”，然后就消失了。你一夜没睡着。'}
];
EV.mischief=e=>{const d=getD(e.id);if(!d||!isRogue(d))return nextEvent();const tg=aliveDs().filter(x=>x.status==='home'&&x.age>=18&&!x.child).sort((a,b)=>b.crush-a.crush)[0];
  evModal('纠缠不休',`<p class="prose">${fmt(pick(MISCHIEF)(d),d,tg)}</p>`,[
    opt('追上去，做个了断',()=>{const r=duel(d);if(r==='dead')return;result(duelText(r,d),d)},false,'red'),
    opt('随'+TA(d)+'去',()=>closeModal())])};
function huntRogue(id){const d=getD(id);if(!d||!isRogue(d))return;hideModal();const from=startTurn();for(let i=0;i<10;i++){simDay();if(G.over)return}G.stats.days+=10;if(d.status==='dead'){G.queue.unshift({k:'msg',title:'讨伐',html:'<p class="prose">你赶到时，那人已经死了。</p>'});return endTurn(from)}
  const r=duel(d);if(r==='dead')return;G.queue.unshift({k:'msg',title:'讨伐',html:`<p class="prose">你追踪了十日，终于在${pick(['一处断崖','魔域边境','荒废的古庙','雪原深处'])}找到了${d.name}。<br>${fmt(duelText(r,d),d)}</p>`});endTurn(from)}
</script>
<script>
// ================= 法器装备（徒弟最多 3 件） =================
function ensureEq(d){if(d.eq)return d.eq;const fs=d.bag.filter(x=>x.k[0]==='f').map(x=>x.k).sort((a,b)=>itemInfo(b).g-itemInfo(a).g).slice(0,3);d.eq=[];fs.forEach(k=>{if(removeItem(d.bag,k))d.eq.push(k)});return d.eq}
function dFaqi(d){return ensureEq(d)}
function equipD(d,k){const eq=ensureEq(d);if(eq.length<3){eq.push(k);return '佩上了'}let wi=0;eq.forEach((x,i)=>{if(itemInfo(x).g<itemInfo(eq[wi]).g)wi=i});if(itemInfo(k).g>itemInfo(eq[wi]).g){const old=eq[wi];eq[wi]=k;addItem(d.bag,old);return `换下了${itemInfo(old).name}，佩上了`}addItem(d.bag,k);return '收进乾坤囊里的'}
// ================= 徒弟自己用药 =================
function autoMed(d){if(d.sick){const k=['p:qb:0','p:qb:1','p:qb:2','p:qb:3'].find(x=>countItem(d.bag,x))||bestPill(d.bag,'hy')||bestPill(d.bag,'hc');if(k){removeItem(d.bag,k);d.sick=false;healD(d,10);d.notes.push(`病了，服下自己收着的${itemInfo(k).name}`)}}
  if(hpPct(d)<.6){const k=bestPill(d.bag,'hy')||bestPill(d.bag,'hc');if(k){removeItem(d.bag,k);const I=itemInfo(k);healD(d,I.kind==='hc'?100:HY[I.g]);d.notes.push(`受了伤，服下自己收着的${I.name}`)}}}
// ================= 生辰 =================
const snap2=d=>({favor:d.favor,mood:d.mood,love:d.love,demon:d.demon,crush:d.crush||0});
function doubleDelta(d,pre){['favor','mood','demon','crush'].forEach(k=>{d[k]=(d[k]||0)+((d[k]||0)-pre[k])});if(!d.child)d.love+=d.love-pre.love;clampD(d)}
function bdayTurn(){const ids=[];G.ds.forEach(d=>{if(d.bdayPending){d.bdayPending=false;if(['home','grad'].includes(d.status)){d.bday=true;d.bdayGift=false;ids.push(d.id)}}});ids.forEach(id=>sibBdayGifts(getD(id)));if(ids.length&&PREF.bday)G.queue.push({k:'dbday',ids});if(G.pbday){G.pbday=false;G.queue.push({k:'pbday'})}}
function bdayExpire(){if(!G)return;G.ds.forEach(d=>{if(!d.bday)return;if(!d.bdayGift&&d.status!=='dead'){d.mood-=10;d.favor-=3;if(d.status==='grad')d.demon+=2;clampD(d);logD(d,d.status==='grad'?'生辰那天，没等到师尊的飞鹤。':'生辰那天没收到师尊的礼物，一个人难过了很久。')}d.bday=false;d.bdayGift=false})}
EV.dbday=e=>{const ds=e.ids.map(getD).filter(d=>d&&d.bday);if(!ds.length)return nextEvent();
  modal({title:'生辰',html:`<p class="prose">今天是${ds.map(d=>d.name).join('、')}的生辰。</p><p class="hint">在下一次行事之前送出礼物：效果翻倍，还有专属的话要对你说。不送的话，${ds.length>1?'他们':TA(ds[0])}会难过。生辰当日，一切互动的效果都翻倍。</p><div class="items">${ds.map(d=>`<div class="item gf-${d.gender}"><div class="info"><div class="nm">${d.name}</div><div class="ds">${seniorTitle(d)}${d.status==='grad'?' · 已出师':''}</div></div>${d.status==='home'?`<button class="btn sm" onclick="giftPicker(${d.id})">送礼</button>`:`<button class="btn sm" onclick="openParcel(${d.id},true)">寄礼</button>`}</div>`).join('')}</div>`,btns:[{t:'知道了',cls:'pri',fn:closeModal}]})};
EV.pbday=()=>{const lines=[];presentDs().forEach(d=>{if(d.child&&d.age<6){lines.push(`${d.name}咿咿呀呀地把口水糊在你脸上，算是贺礼。`);addHeart(1,d);return}if(d.favor<30){lines.push(`${d.name}远远地行了个礼，没说什么。`);return}
    const its=d.bag.filter(x=>x.k[0]==='p');if(its.length&&chance(.5)){const k=pick(its).k;removeItem(d.bag,k);addItem(G.bag,k);lines.push(`${d.name}把自己攒着的${itemInfo(k).name}塞给了你：“{s}生辰快乐！”`.replace('{s}','师尊'))}else lines.push(`${d.name}${pick(PB_HAND)}送给你。`);if(d.age>=18&&d.love>=50)addHeart(2,d)});
  G.ds.filter(d=>d.status==='grad'&&d.favor>=40&&chance(.6)).forEach(d=>{let att;if(chance(.5)){const v=Math.round(ri(30,120)*(1+d.realm/25));G.p.jade+=v;att=`灵玉 ×${v}`}else{const k=chance(.25)?randFaqi(rollGrade(d.realm)):randPill(rollGrade(d.realm));addItem(G.bag,k);att=itemInfo(k).name}
    G.nmail=(G.nmail||0)+1;G.mail.unshift({id:G.nmail,t:dateStr(),from:d.name,did:d.id,career:CAREERS[d.career].n,html:`<p>师尊生辰快乐！</p><p>弟子远在${pick(PLACES)}，不能回来给您磕头，只能托飞鹤捎去一点心意。愿师尊福寿绵长，道途顺遂。</p><p style="text-align:right">${d.name}遥拜</p>`,att,replied:false});G.mailBadge=true;lines.push(`已出师的${d.name}寄来贺信，附${att}。`)});
  log(`今日是你的生辰，${G.p.age}岁。`);lines.forEach(l=>log('生辰贺礼：'+l.replace(/<[^>]+>/g,'')));modal({title:'你的生辰',html:`<p class="prose">今日是你的生辰。</p><ul class="dlog" style="max-height:none;font-size:14px">${lines.map(l=>`<li>${l}</li>`).join('')||'<li>洞府里冷冷清清，没人记得。</li>'}</ul>`,btns:[{t:'收下',cls:'pri',fn:closeModal}]})};
// ================= 互动包装：生辰翻倍、病中关怀 =================
const _interact=interact;
interact=function(id,act){const d=getD(id);if(!d||act==='gift')return _interact(id,act);const pre=snap2(d),pre1=snap(d);const apBefore=apLeft();const r=_interact(id,act);if(apLeft()===apBefore)return r;
  if(act==='care'&&d.sick&&!d.child)addLove(d,3*MB[d.mbti].rom);
  if(d.bday){doubleDelta(d,pre);const el=document.querySelector('#modal .delta');if(el)el.textContent=(deltaText(pre1,d)||'')+'（生辰当日，效果翻倍）'}else if(act==='care'&&d.sick){const el=document.querySelector('#modal .delta');if(el)el.textContent=deltaText(pre1,d)+'（病中被照顾，格外触动）'}save();return r};
const _applyEff=applyEff;
applyEff=function(d,e,sib){const pre=snap2(d);const r=_applyEff(d,e,sib);if(d.bday)doubleDelta(d,pre);return r};
const _sendParcel=sendParcel;
sendParcel=function(id){const d=getD(id);const pre=snap2(d);const had=PARCEL&&Object.values(PARCEL.items).some(n=>n>0);_sendParcel(id);if(d&&d.bday){doubleDelta(d,pre);if(had){d.bdayGift=true;const l=fmt(pick(BDAY_T[d.mbti]),d);logD(d,`生辰收到师尊寄来的礼物。回信里写：“${l}”`);toast(`${d.name}回信：${l}`)}}save()};
// ================= 赠予（重写） =================
function giveItem(id,k){const d=getD(id);const I=itemInfo(k);if(I.kind==='yh')return toast('引魂香是祭奠用的');if(!removeItem(G.bag,k))return;const f=fx(d),before=snap(d),pre=snap2(d);let line;const hurt=d.sick||hpPct(d)<1;
  if(I.type==='p'){const g=I.g;
    if(I.kind==='mj'){d.mood+=MJ[g]*(f.foodie?3:1);d.favor+=2+g;line=pick(REACT.gift.food)}
    else if(I.kind==='jq'||I.kind==='yl'){addDXP(d,I.kind==='jq'?20*GM[g]:needXP(d.realm)*[1,2,3,5][g]/100);d.favor+=2+g;line='（当场服下，运功炼化）多谢{s}！弟子感觉修为又进了一步。'}
    else if(['hy','hc','qb'].includes(I.kind)){if(hurt){if(I.kind==='hc')healD(d,100);else if(I.kind==='hy')healD(d,HY[g]);else healD(d,10);d.sick=false;d.favor+=3;line=d.sick?'':'（服下后脸色好多了）谢谢{s}……弟子好多了。'}else{addItem(d.bag,k);d.favor+=2;line='弟子现在好好的，先收着，等用得上的时候再吃。'}}
    else if(I.kind==='jx'){if(d.demon>=30){d.demon-=JX[g];line='（服下后，眉间的郁色淡了些）谢谢{s}。'}else{addItem(d.bag,k);line='弟子心里还算平静，这颗先收着。'}d.favor+=2}
    else if(I.kind==='wq'){addLove(d,-WQ[g]);d.favor-=3;line='（服下后怔了片刻）……奇怪，心里好像空了一块。'}
    else if(I.kind==='zy'){d.mood+=[15,25,40,60][g];d.favor+=3;line=pick(REACT.gift.good)}
    else if(I.kind==='zl'){d.favor-=1;line=truthLine(d)}
    else if(I.kind==='ct'){const add=[10,20,30,40][g];if((d.hpf||0)>=500){addItem(d.bag,k);line='弟子的筋骨已经淬炼到头了，这颗先收着吧。'}else{d.hpf=Math.min(500,(d.hpf||0)+add);d.favor+=3;line='（筋骨噼啪作响）弟子觉得自己结实多了！'}}
    else if(I.kind==='fs'){d.revive=true;d.favor+=10;line='这么珍贵的丹药……弟子一定好好收着这条命。'}
    else if(I.kind==='xs'){if(d.root.els.length>1&&!d.root.mut){d.root.els.splice(ri(0,d.root.els.length-1),1);d.favor+=10;line=`（洗髓伐骨，痛得满身冷汗）……弟子的灵根，变成了${rootName(d.root)}！`}else{addItem(G.bag,k);line='弟子已是单灵根，洗髓丹用不上了。'}}
    else{addItem(d.bag,k);d.favor+=2+2*g;line=pick(REACT.gift.good)}}
  else{const how=equipD(d,k);d.favor+=6*(I.g+1);line=(d.age>=18&&d.love>=50?pick(REACT.gift.love):pick(REACT.gift.good))+`（${how}${I.name}）`;if(d.age>=18&&d.love>=50){addLove(d,3);addHeart(2,d)}}
  let extra='';if(d.bday){doubleDelta(d,pre);if(!d.bdayGift){d.bdayGift=true;line=pick(BDAY_T[d.mbti]);logD(d,`生辰收到了师尊的礼物：${I.name}。`)}extra='（生辰当日，效果翻倍）'}
  jealousy(d,I.type==='f'?1.5:.6);logD(d,`收到师尊赠予的${I.name}。`);clampD(d);save();giftPicker(id,fmt(line||'谢谢{s}。',d),deltaText(before,d)+extra,I.name)}
</script>
<script>
// 偏好设置（跨存档）
const PREF_KEY='wqd_pref_v1';let PREF={bday:true};try{PREF=Object.assign(PREF,JSON.parse(localStorage.getItem(PREF_KEY)||'{}'))}catch(e){}
function savePref(){try{localStorage.setItem(PREF_KEY,JSON.stringify(PREF))}catch(e){}}
// 同门之间的生辰礼
const SIB_HAND=SP(`亲手编的剑穗|一包桂花糕|一只木雕小鹤|一首写得歪歪扭扭的贺诗|一盏兔子灯|一块漂亮的鹅卵石|一只草编蚂蚱|一张画像|一个绣着名字的香囊|一坛偷偷埋了半年的果酒`);
function sibBdayGifts(d){if(!d||d.status!=='home')return;presentDs().forEach(o=>{if(o===d||(o.child&&o.age<6))return;const rel=getRel(o,d);if(rel<30&&!isKin(o,d))return;if(!chance(.75))return;
  const its=o.bag.filter(x=>x.k[0]==='p');let what;if(its.length&&chance(.4)){const k=pick(its).k;removeItem(o.bag,k);addItem(d.bag,k);what=itemInfo(k).name}else what=pick(SIB_HAND);
  addRel(o,d,3);d.mood+=5;clampD(d);logD(d,`生辰，${sibName(d,o)}送了${what}。`);logD(o,`给${sibName(o,d)}送了生辰礼：${what}。`)})}
</script>
<script>
// ================= 弟子灵根：都是主角，没有四五灵根 =================
function rollRootD(){if(chance(.12))return{els:[pick(MUT)],mut:true};const n=wpick([3,2,1],x=>({3:40,2:35,1:25})[x]);return{els:[...ELEM].sort(()=>R()-.5).slice(0,n),mut:false}}
// ================= 生辰：前后三日 =================
function doy(m,d){let s=0;for(let i=0;i<m-1;i++)s+=DIM[i];return s+d}
function bdDiff(x){let v=doy(x.bm,x.bd)-doy(G.date.m,G.date.d);if(v>182)v-=365;if(v<-182)v+=365;return v}
function bdayDaily(){G.ds.forEach(x=>{if(!['home','grad'].includes(x.status)){x.bday=false;return}const w=Math.abs(bdDiff(x))<=3;
  if(w&&!x.bday){x.bday=true;x.bdayGift=false;if(x.status==='home')sibBdayGifts(x)}
  else if(!w&&x.bday){if(!x.bdayGift){x.mood-=10;x.favor-=3;if(x.status==='grad')x.demon+=2;clampD(x);logD(x,x.status==='grad'?'生辰那几日，没等到师尊的飞鹤。':'生辰那几日没收到师尊的礼物，一个人难过了很久。')}x.bday=false}})}
function bdayExpire(){}
function bdayTurn(){const now=[],soon=[];const y=G.date.y;G.ds.forEach(x=>{if(!['home','grad'].includes(x.status))return;const v=bdDiff(x);
    if(x.bday&&!x.bdayGift&&x.bdNow!==y){x.bdNow=y;now.push(x.id)}else if(v>3&&v<=30&&x.bdSoon!==y){x.bdSoon=y;soon.push(x.id)}});
  if((now.length||soon.length)&&PREF.bday)G.queue.push({k:'dbday',ids:now,soon});if(G.pbday){G.pbday=false;G.queue.push({k:'pbday'})}}
EV.dbday=e=>{const ds=(e.ids||[]).map(getD).filter(d=>d&&d.bday&&!d.bdayGift);const ss=(e.soon||[]).map(getD).filter(Boolean);if(!ds.length&&!ss.length)return nextEvent();
  modal({title:'生辰',html:`${ds.length?`<p class="prose">${ds.map(d=>d.name).join('、')}正逢生辰（前后三日内）。</p><div class="items">${ds.map(d=>`<div class="item gf-${d.gender}"><div class="info"><div class="nm">${d.name}</div><div class="ds">${d.bm}月${d.bd}日 · ${d.status==='grad'?'已出师':seniorTitle(d)}</div></div>${d.status==='home'?`<button class="btn sm" onclick="giftPicker(${d.id})">送礼</button>`:`<button class="btn sm" onclick="openParcel(${d.id},true)">寄礼</button>`}</div>`).join('')}</div><p class="hint">生辰这几日送礼效果翻倍，一切互动效果也翻倍。错过了，${ds.length>1?'他们':TA(ds[0])}会难过。</p>`:''}
   ${ss.length?`<div class="blk"><h4>生辰将至</h4>${ss.map(d=>`<p class="hint">${d.name}：${d.bm}月${d.bd}日（还有 ${bdDiff(d)} 天）</p>`).join('')}<p class="fdesc">别闭关太久，错过了就补不回来了。</p></div>`:''}`,btns:[{t:'知道了',cls:'pri',fn:closeModal}]})};
// ================= 转世 / 夺舍 =================
const _walkin=EV.walkin;
EV.walkin=e=>{if(e.src!=='reborn')return _walkin(e);const d=getD(e.old);if(!d||d.status!=='dead')return nextEvent();const ds=d.demon>=50;const free=freeSlots();
  evModal(ds?'夺舍归来':'转世归来',`<p class="prose">${ds?`一个十四岁的孩子站在洞府外，眼神却老得可怕。${TA(d)}冲你笑了笑：“师尊，好久不见。”<br>那是${d.name}的笑。一模一样。`:`一个十四岁的孩子跪在洞府外。看见你的那一刻，${TA(d)}愣住了，脱口而出：“师尊……”<br>同样的名字，同样的眉眼——${d.name}。`}</p>${candCard(d,-1,false)}<p class="hint">${ds?'夺舍：带着前世的全部记忆归来，心魔会持续滋长。':'转世：前世的一切都在，只是记忆还沉睡着。等好感满了，或许会想起来。'}</p>`,
   [{t:free>0?'收入门下':`门下已满（${slotsMax()}人）`,cls:'pri',dis:free<=0,fn:()=>{reviveD(d,ds?'ds':'zs');closeModal()}},opt('婉拒',()=>{d.rebornSched=false;closeModal()})])};
function reviveD(d,type){d.status='home';d.age=14;d.hp=null;d.sick=false;d.away=0;d.reborn=type;d.mem=type==='ds';d.rebornSched=false;d.joinDate=dateStr();d.bday=false;d.endDate=null;d.lastContact=dn(G.date);if(type==='ds')d.demon=Math.max(d.demon,50);clampD(d);
  const t=type==='ds'?'夺舍':'转世';logD(d,`${t}归来，十四岁，重新拜入${G.p.name}门下。`);log(`${d.name}${t}归来，重回师门。`);unlock('reborn');homeDs().forEach(o=>{if(o!==d&&G.rel[relKey(o,d)]==null)G.rel[relKey(o,d)]=0})}
const _dDaily=dDaily;
dDaily=function(d){const r=_dDaily(d);if(!r)return r;if(d.reborn==='ds')d.demon=clamp(d.demon+.08*MB[d.mbti].dark,0,100);
  if(d.reborn==='zs'&&!d.mem&&d.favor>=100&&!G.queue.some(e=>e.k==='remember'&&e.id===d.id))G.queue.push({k:'remember',id:d.id});
  if(G.date.d===1&&chance(.4)){const eq=ensureEq(d);const best=d.bag.filter(x=>x.k[0]==='f').sort((a,b)=>itemInfo(b.k).g-itemInfo(a.k).g)[0];if(best){if(eq.length<3){removeItem(d.bag,best.k);eq.push(best.k);d.notes.push(`佩上了${itemInfo(best.k).name}`)}else{let wi=0;eq.forEach((x,i)=>{if(itemInfo(x).g<itemInfo(eq[wi]).g)wi=i});if(itemInfo(best.k).g>itemInfo(eq[wi]).g){const old=eq[wi];removeItem(d.bag,best.k);eq[wi]=best.k;addItem(d.bag,old);d.notes.push(`把${itemInfo(old).name}换成了${itemInfo(best.k).name}`)}}}}
  return r};
EV.remember=e=>{const d=getD(e.id);if(!d||d.mem)return nextEvent();d.mem=true;logD(d,'忆起了前世的一切。');log(`${d.name}忆起了前世。`);
  modal({title:'前尘',html:`<p class="prose">${d.name}忽然停下了手里的事，怔怔地看着你，很久很久。<br>“师尊……”${TA(d)}的声音在发抖，“我想起来了。我全都想起来了。”</p>`,btns:[{t:'……',cls:'pri',fn:closeModal}]})};
const _rollEvent=rollEvent;
rollEvent=function(d){if(d.reborn==='ds'&&d.demon>=90&&chance(.4))return{k:'awaken',id:d.id};return _rollEvent(d)};
const _chatLine=chatLine;
chatLine=function(d){if(d.truth){d.truth=false;return truthLine(d)}if(d.mem&&MEM_T[d.mbti]&&chance(.5))return pick(MEM_T[d.mbti]);return _chatLine(d)};
// ================= 徒弟自己安排丹药 =================
function autoMed(d){const b=d.bag;const use=(k,msg)=>{removeItem(b,k);d.notes.push(msg.replace('%',itemInfo(k).name))};
  if(d.sick){const k=bestPill(b,'hy');if(k){use(k,'病了，服下自己收着的%');d.sick=false;d.tend=0;healD(d,20)}}
  if(hpPct(d)<.6){const k=bestPill(b,'hy');if(k){const I=itemInfo(k);use(k,'受了伤，服下了%');healD(d,HY[I.g])}}
  if(d.mood<40){const k=bestPill(b,'mj');if(k){const I=itemInfo(k);use(k,'心情不好，吃了一颗%');d.mood+=I.kind==='mj'?MJ[I.g]*(fx(d).foodie?3:1):[15,25,40,60][I.g]}}
  if(chance(.03)){const k=bestPill(b,'ct');if(k&&(d.hpf||0)<500){use(k,'服下%淬炼筋骨');d.hpf=Math.min(500,(d.hpf||0)+[10,20,30,40][itemInfo(k).g])}}
  if(chance(.05)){const k=bestPill(b,'yl');if(k){use(k,'修炼时服下了%');addDXP(d,needXP(d.realm)*[1,2,3,5][itemInfo(k).g]/100)}}
  if(chance(.01)){const k=bestPill(b,'xs');if(k&&d.root.els.length>1&&!d.root.mut){use(k,'服下%，洗去了一条灵根');d.root.els.splice(ri(0,d.root.els.length-1),1)}}
  if(!wqNever(d)&&d.love>=30&&((d.rejT&&dn(G.date)-d.rejT<60)||(d.love>=70&&d.favor<25))&&chance(.02)){const k=bestPill(b,'wq');if(k){use(k,'偷偷服下了%，想忘掉一些事');addLove(d,-WQ[itemInfo(k).g])}}
  if(chance(.02)){const k=bestPill(b,'zl');if(k){use(k,'误服了%');d.truth=true}}
  if(countItem(b,'p:fs:3')&&!d.revive){removeItem(b,'p:fs:3');d.revive=true}
  clampD(d)}
// ================= 赠予（重写）：丹药一律收着 =================
function giveItem(id,k,quiet){const d=getD(id);if(typeof syncBday==='function')syncBday(d);const I=itemInfo(k);if(I.kind==='yh'){toast('引魂香是祭奠用的');return null}
  if(I.type==='p'&&I.kind!=='zl'&&!d.bag.some(x=>x.k===k)&&d.bag.length>=bagCap(d.bag)&&!(I.kind==='hy'&&(d.sick||hpPct(d)<1))){toast(`${d.name}的乾坤囊满了（${bagCap(d.bag)}格），装不下新的东西`);return null}
  if(!removeItem(G.bag,k))return null;const before=snap(d),pre=snap2(d);let line;
  if(I.type==='p'){const g=I.g;
    if(I.kind==='zl'){line=zlTake(d,k)}
    else if(I.kind==='hy'&&(d.sick||hpPct(d)<1)){healD(d,HY[g]+(d.sick?10:0));d.sick=false;d.tend=0;d.favor+=4;line='（接过药就服下了，脸色好多了）谢谢{s}……弟子好多了。'}
    else{addItem(d.bag,k);d.favor+=2+g;line=I.kind==='wq'?(wqNever(d)?'（捏着那颗丹药看了很久，把它收进了最深处）……{s}放心，弟子不会吃的。弟子的心，弟子自己清楚。':d.love>=30?'（手指微微一颤）……弟子先收着。':'忘情丹？弟子用不上，不过还是谢谢{s}。'):I.kind==='mj'?'（眼睛一亮，小心地收了起来）留着心情不好的时候吃！':I.kind==='jq'||I.kind==='yl'?'弟子会在修炼时用上的，谢谢{s}！':pick(REACT.gift.good)}}
  else{const how=equipD(d,k);d.favor+=6*(I.g+1);line=(d.age>=18&&d.love>=50?pick(REACT.gift.love):pick(REACT.gift.good))+`（${how}${I.name}）`}
  if(d.age>=18&&!d.child&&d.love>=40){addLove(d,2);addHeart(3,d)}
  let extra='';if(d.bday){doubleDelta(d,pre);if(!d.bdayGift){d.bdayGift=true;logD(d,`生辰收到了师尊的礼物：${I.name}。`)}line=pick(BDAY_T[d.mbti]);extra='（生辰，效果翻倍）'}
  jealousy(d,I.type==='f'?1.5:.6);logD(d,`收到师尊赠予的${I.name}。`);clampD(d);save();const res={line:fmt(line||'谢谢{s}。',d),delta:deltaText(before,d)+extra,name:I.name};if(!quiet)giftPicker(id,res.line,res.delta,res.name);return res}
function giveAll(id,k){const n=countItem(G.bag,k);let last=null,c=0;const before=snap(getD(id));for(let i=0;i<n;i++){const r=giveItem(id,k,true);if(!r)break;last=r;c++}if(last)giftPicker(id,last.line,deltaText(before,getD(id))+`（共赠出 ${c} 枚）`,last.name+(c>1?'×'+c:''));else giftPicker(id)}
function useAll(k){let n=countItem(G.bag,k);while(n>0){usePill(k);const m=countItem(G.bag,k);if(m>=n)break;n=m}openBag('p')}
// ================= 照料 =================
const _interact2=interact;
interact=function(id,act){if(act!=='tend')return _interact2(id,act);const d=getD(id);if(!canTalk(d))return;if(!(d.sick||injD(d)))return toast(`${d.name}好好的，不需要照料`);if(apLeft()<=0)return toast('本回合互动点已用完');useAp();const before=snap(d),pre=snap2(d);let line;
  if(d.sick){d.tend=(d.tend||0)+1;if(d.tend>=3){d.sick=false;d.tend=0;healD(d,15);line='（烧退了，睁开眼看见你还守在床边）……{s}一直在吗？';logD(d,'病中师尊照料了三回，终于好了。')}else line=pick(['（迷迷糊糊地拉住你的袖子）{s}……别走……','（喝完你喂的药，皱着脸）好苦……可是{s}喂的，不苦。','（烧得脸通红）弟子没事……{s}别担心……'])+`（照料 ${d.tend}/3）`}
  else{healD(d,10);line=pick(['（你替{d}换了药）……谢谢{s}。','（{d}靠在床头，看着你忙前忙后）{s}，您不用亲自来的……','（疼得龇牙咧嘴，却还在笑）有{s}在，伤好得快。'])}
  d.favor+=4;d.mood+=5;addLove(d,2*MB[d.mbti].rom*(d.sick||d.tend?2:1));if(d.age>=18&&!d.child&&d.love>=30)addHeart(3,d);if(d.child)addHeart(2,d);if(d.bday)doubleDelta(d,pre);jealousy(d,.6);clampD(d);save();renderInteract(d,fmt(line,d),deltaText(before,d)+(d.bday?'（生辰，效果翻倍）':''))};
// 互动越多，心越乱
const _interact3=interact;
interact=function(id,act){const d=getD(id);const ap=apLeft();const r=_interact3(id,act);if(d&&apLeft()<ap&&['chat','care','toast'].includes(act)&&d.age>=18&&!d.child&&d.love>=30){const c0=d.crush||0;addHeart(2+d.love/25,d);const g=Math.round((d.crush||0)-c0);const el=document.querySelector('#modal .delta');if(el&&g>0)el.textContent=(el.textContent?el.textContent+' · ':'')+`心又乱了几分（心动 +${g}）`}return r};
// ================= 藏宝阁：买 / 卖 =================
function openShop(tab){tab=tab||'buy';const head=`<div class="tabs"><button class="${tab==='buy'?'on':''}" onclick="openShop('buy')">买</button><button class="${tab==='sell'?'on':''}" onclick="openShop('sell')">卖</button></div><p class="hint">灵玉 ${G.p.jade}。${tab==='buy'?'货品每月初更换。':'按三成价格收购。'}</p>`;
  const body=tab==='buy'?`<div class="items">${G.shop.map((x,i)=>{const I=itemInfo(x.k);return `<div class="item"><div class="info"><div class="nm">${gd(I.g)}${I.name}</div><div class="ds">${I.desc}</div></div><span class="ct">余${x.n}</span><button class="btn sm" ${x.n<=0||G.p.jade<I.price?'disabled':''} onclick="buy(${i})">${I.price}灵玉</button></div>`}).join('')}</div>`
   :`<div class="items">${G.bag.length?G.bag.map(x=>{const I=itemInfo(x.k),v=Math.round(I.price*.3);return `<div class="item"><div class="info"><div class="nm">${gd(I.g)}${I.name} <span class="ct">×${x.n}</span></div><div class="ds">单价 ${v} 灵玉</div></div><button class="btn sm" onclick="sellIt('${x.k}')">卖1</button>${x.n>1?`<button class="btn sm" onclick="sellIt('${x.k}',1)">全卖 ${v*x.n}</button>`:''}</div>`}).join(''):'<p class="hint">乾坤囊空空如也。</p>'}</div>`;
  modal({title:'藏宝阁',html:head+body,btns:[{t:'离开',cls:'pri',fn:closeModal}]})}
function buy(i){const x=G.shop[i],I=itemInfo(x.k);if(G.p.jade<I.price||x.n<=0)return;const had=G.bag.some(y=>y.k===x.k);if(!had&&G.bag.length>=bagCap(G.bag))return toast('乾坤囊已满，先腾出格子吧');G.p.jade-=I.price;x.n--;addItem(G.bag,x.k);toast(`买下${I.name}`);save();openShop('buy')}
function sellIt(k,all){const I=itemInfo(k);const n=all?countItem(G.bag,k):1;if(!removeItem(G.bag,k,n))return;const v=Math.round(I.price*.3)*n;G.p.jade+=v;toast(`卖出${I.name}×${n}，灵玉 +${v}`);save();openShop('sell')}
</script>
<audio id="bgm" src="BackgroundMusic.mp3" loop preload="auto"></audio>
<script>
// ================= 背景音乐 =================
// 音乐文件需与本 html 放在同一文件夹，文件名 BackgroundMusic.mp3
const BGM_KEY='wqd_bgm_v1';
let BGM={on:true,vol:.5,missing:false};
try{const s=JSON.parse(localStorage.getItem(BGM_KEY)||'null');if(s)BGM=Object.assign(BGM,s,{missing:false})}catch(e){}
const bgmEl=()=>document.getElementById('bgm');
function bgmSave(){try{localStorage.setItem(BGM_KEY,JSON.stringify({on:BGM.on,vol:BGM.vol}))}catch(e){}}
function bgmApply(){const a=bgmEl();if(!a)return;a.volume=BGM.vol;if(BGM.on&&!BGM.missing){const p=a.play();if(p&&p.catch)p.catch(()=>{})}else a.pause()}
function bgmToggle(){BGM.on=!BGM.on;bgmSave();bgmApply();if(BGM.missing&&BGM.on)toast('没有找到 BackgroundMusic.mp3，请把它和游戏放在同一个文件夹');else toast(BGM.on?'背景音乐：开':'背景音乐：关');refreshBgmUI()}
function bgmVol(v){BGM.vol=clamp(+v,0,1);bgmSave();const a=bgmEl();if(a)a.volume=BGM.vol}
function refreshBgmUI(){document.querySelectorAll('[data-bgm-label]').forEach(el=>el.textContent=BGM.on?'背景音乐：开':'背景音乐：关')}
function bgmBlock(){return `<div class="blk"><h4>背景音乐</h4><div class="goals"><button class="${BGM.on?'on':''}" data-bgm-label onclick="bgmToggle();this.classList.toggle('on',BGM.on)">${BGM.on?'背景音乐：开':'背景音乐：关'}</button></div><div class="barrow" style="margin-top:8px"><span>音量</span><input type="range" id="bgm-vol" min="0" max="1" step="0.05" value="${BGM.vol}" oninput="bgmVol(this.value)" aria-label="音量"><span>${BGM.missing?'未找到音乐文件':''}</span></div></div>`}
(function(){const a=bgmEl();if(!a)return;a.volume=BGM.vol;a.addEventListener('error',()=>{BGM.missing=true});
  // 浏览器要求玩家先点一下页面才能出声
  const kick=()=>{if(BGM.on)bgmApply();document.removeEventListener('pointerdown',kick);document.removeEventListener('keydown',kick)};
  document.addEventListener('pointerdown',kick);document.addEventListener('keydown',kick)})();
</script>
<script>
// ================= 弹窗 =================
let MCB=[];
function modal(o){MCB=[];if(o.html)o.html=sectify(o.html);if(o.title)o.title=sectify(o.title);const btns=(o.btns||[]).map(b=>{const i=MCB.push(b.fn)-1;return `<button class="btn ${b.cls||''}" ${b.id?`id="${b.id}"`:''} ${b.dis?'disabled':''} onclick="mcb(${i})">${b.t}</button>`}).join('');
  const m=$('#modal');m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${o.title?`<div class="sheet-h"><h3>${o.title}</h3>${o.x!==false?'<button class="x" aria-label="关闭" onclick="closeModal()">×</button>':''}</div>`:''}<div class="sheet-b">${o.html||''}</div>${btns?`<div class="sheet-f">${btns}</div>`:''}</div>`;m.hidden=false;m.querySelector('.sheet-b').scrollTop=0}
function mcb(i){const f=MCB[i];if(f)f()}
function hideModal(){const m=$('#modal');m.hidden=true;m.innerHTML=''}
function closeModal(){hideModal();if(!G)return;if(G.feast&&!G.feastClosing)return openFeast();save();render();nextEvent()}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&$('#modal .x'))closeModal()});
const apDots=n=>'<i class="on"></i>'.repeat(Math.max(0,Math.min(n,8)))+'<i></i>'.repeat(Math.max(0,3-n));

// ================= 主渲染 =================
function render(){if(!G)return renderTitle();if(G.over)renderEnding();else renderMain();if(G.sect&&G.sect!=='玄天宗'){const a=$('#app');a.innerHTML=sectify(a.innerHTML)}}
function renderTitle(){document.body.className='';const sv=loadSave();const has=!!sv&&!sv.over;$('#app').innerHTML=`<div class="title-screen">
  <div class="vtitle"><div class="bigseal">为人<br>师表</div><h1>无情道教资保卫战</h1><div class="sub">师尊是一个高危职业</div></div>
  <p class="tagline">你修的是无情道，动心即死。<br>可宗门要你收徒，而你的每个徒弟，都长着一张男女主角的脸。</p>
  <div class="title-btns">${has?'<button class="btn pri" onclick="continueGame()">继续修行</button>':''}<button class="btn ${has?'':'pri'}" onclick="renderSetup()">${has?'重新入道':'踏入仙途'}</button><button class="btn" onclick="openCodex('fate')">图鉴</button><button class="btn" data-bgm-label onclick="bgmToggle()">${BGM.on?'背景音乐：开':'背景音乐：关'}</button></div></div>`}
function continueGame(){G=loadSave();if(!G)return renderTitle();G.feast=null;G.sect=G.sect||'玄天宗';G.resting=false;G.caveLv=G.caveLv||0;G.bagLv=G.bagLv||0;G.sr=null;render();nextEvent()}

// ---------- 角色创建 ----------
let S=null;
function renderSetup(){if(!S)S={name:'',gender:'m',age:100,bm:3,bd:15,root:rollRoot(),rolls:0};
  const months=Array.from({length:12},(_,i)=>`<option value="${i+1}" ${S.bm===i+1?'selected':''}>${i+1}月</option>`).join('');
  const days=Array.from({length:DIM[S.bm-1]},(_,i)=>`<option value="${i+1}" ${S.bd===i+1?'selected':''}>${i+1}日</option>`).join('');
  $('#app').innerHTML=`<header class="top"><div><div class="date">修仙世界</div><div class="cave">立命</div></div></header>
  <div class="form">
   <div class="field"><label class="l" for="f-name">道号</label><input type="text" id="f-name" maxlength="4" placeholder="无名" value="${esc(S.name)}" oninput="S.name=this.value"><p class="hint">1至4个字，留空则为“无名”。</p></div>
   <div class="field"><label class="l">性别</label><div class="seg">${Object.entries(GN).map(([k,v])=>`<button class="gf-${k} ${S.gender===k?'on':''}" style="border:1.5px solid" onclick="S.gender='${k}';renderSetup()">${v}</button>`).join('')}</div><p class="hint">不影响任何剧情，本游戏全性向友好。</p></div>
   <div class="row2"><div class="field"><label class="l">年龄</label><div class="fixed-age" style="padding:10px 0;font-size:17px">100 岁</div></div>
   <div class="field"><label class="l" for="f-bm">生辰</label><div class="row2"><select id="f-bm" onchange="S.bm=+this.value;S.bd=Math.min(S.bd,DIM[S.bm-1]);renderSetup()">${months}</select><select id="f-bd" onchange="S.bd=+this.value">${days}</select></div></div></div>
   <div class="field"><label class="l">灵根</label><div class="rootbox"><div><b>${rootName(S.root)}</b>${S.root.els.map(e=>`<span class="chip" style="background:${ELC[e]}">${e}</span>`).join('')}<p class="hint">修炼倍率 ×${rootMult(S.root)} · 已洗髓 ${S.rolls} 次</p></div><button class="btn" onclick="S.root=rollRoot();S.rolls++;renderSetup()">重洗灵根</button></div><p class="hint">灵根越少越稀有，还有小概率洗出雷、风、冰变异天灵根。</p></div>
   <button class="btn pri big" onclick="startStory()">渡劫</button>
  </div>`}
function startStory(){S.name=(S.name||'').trim().slice(0,4)||'无名';renderStory(0)}
function renderStory(i){const pages=[
  `<p>九道天雷劈落，你在焦土中睁开眼。</p><p>终于，你度过了元婴天劫，成为了一名长老。</p><p>你所在的宗门，名为……</p><div class="field"><input type="text" id="f-sect" maxlength="8" placeholder="玄天宗" value="" aria-label="宗门名"></div>`,
  `<p>作为长老，你得到了自己的山头。</p><p>它叫……</p><div class="field"><input type="text" id="f-cave" maxlength="8" placeholder="无名洞府" value=""></div>`,
  `<p>宗门开始每月给你发放资源。</p><p>当然，天下没有白吃的午餐。当上长老，就要为宗门多多纳新。收徒，是必不可少的。</p><p>只有一件事你要记住：<b style="color:var(--cinnabar)">你修的是无情道。动心，即死。</b></p>`];
  $('#app').innerHTML=`<div class="story"><div class="prose">${pages[i]}</div><button class="btn pri" onclick="storyNext(${i})">${i<2?'继续':'入主洞府'}</button></div>`}
function storyNext(i){if(i===0){const v=($('#f-sect').value||'').trim();S.sect=v||'玄天宗'}if(i===1){const v=($('#f-cave').value||'').trim();S.cave=v||'无名洞府'}if(i<2)return renderStory(i+1);newGame()}
function newGame(){G={v:3,sect:S.sect||'玄天宗',date:{y:100,m:5,d:31},p:{name:S.name,gender:S.gender,age:100,bm:S.bm,bd:S.bd,root:S.root,realm:20,xp:0,jade:200,rank:1,kpi:0,brk:0,eq:[]},
  cave:S.cave,bag:[],ds:[],ap:3,log:[],mail:[],queue:[],events:[],shop:[],tut:1,stats:{days:0,recruited:0,grads:0,refused:0},nid:1,seq:0,rel:{},reborn:[],over:null,feast:null};
  if(S.root.mut)unlock('mut');
  addItem(G.bag,'p:jq:0',3);addItem(G.bag,'p:jx:0',2);addItem(G.bag,'p:mj:0',2);addItem(G.bag,'f:zp');refreshShop();genTasks();S=null;log(`入主${G.cave}。`);save();render();showGuide()}
function showGuide(){modal({title:`${G.cave} · 洞府指南`,html:`<div class="prose" style="font-size:14px">
  <p><b>名牌</b>：修为、气血、灵玉、战力与宗门KPI。气血低于三成为受伤、一成为重伤，无法修炼只能静养；归零即死。修为满了遇到瓶颈，要手动「冲击」突破，失败会跌落一个小境界。越往后越难。</p>
  <p><b style="color:var(--cinnabar)">动心</b>：你对每个成年徒弟都有一份“心动”，主页的动心条是所有心动之和，满 100 即道心破碎。接受徒弟的好意、对其格外好，心动就会涨。静心丹、闭关、游山玩水可以平复。</p>
  <p><b>门下弟子</b>：起初只能收 1 人，升职后名额增加，最多 6 人。弟子之间按入门先后排师兄师姐，也会亲近、吃醋、打架，甚至结为道侣。</p>
  <p><b>互动</b>：每回合 3 点互动（闲聊、督促、关怀、冷落、辱骂、责罚）；赠予不耗互动。徒弟也会主动来邀你做事。</p>
  <p><b>宗门大事</b>：新春红包与家宴、三月大比、清明、六月收徒、七夕、中秋家宴、中元、双十一藏宝阁拍卖。</p>
  <p><b>宗门KPI</b>：年末考核。达标升职，太差降职，降无可降就被逐出宗门。</p>
  <p class="hint">徒弟的性格、爱恋与心魔看不见。多闲聊，多看日程，从他们的话里听出端倪。</p></div>`,btns:[{t:'知道了',cls:'pri',fn:closeModal}]})}

function renderMain(){document.body.className='cave-'+(G.caveLv||0);const p=G.p,need=needP(p.realm);const tgt=rankTarget(p.rank)*(G.date.y===100?.5:1);const ht=heartTotal();const nreq=p.rank<8?RANK_REQ[p.rank+1]:0;
  const evs=G.events.map((e,i)=>`<button class="event" onclick="runEvent(${i})"><span class="seal-s">宗</span><span><b>宗门大事 · ${e.label}</b><small>截止 ${e.untilStr}</small></span><span aria-hidden="true">›</span></button>`).join('');
  const ds=homeDs();const mx=slotsMax();const nSlots=Math.max(ds.length,mx);const cells=[];for(let i=0;i<Math.max(3,Math.ceil(Math.max(nSlots,1)/3)*3);i++){if(ds[i])cells.push(dCard(ds[i]));else if(i<mx)cells.push(`<div class="dcard empty"><div class="av">空</div><div class="dn">虚位以待</div><div class="dr">${G.tut<3?'收徒大会':'六月收徒 · 游历有缘'}</div></div>`);else{const need=SLOTS.findIndex(s=>s>i);cells.push(`<div class="dcard empty locked"><div class="av">锁</div><div class="dn">未解锁</div><div class="dr">${need>=0?'升至'+RANKS[need]:''}</div></div>`)}}
  const bp=canBreak()?Math.round(clamp(BREAK[p.realm][0]+p.brk,0,.98)*100):0;
  $('#app').innerHTML=`
  <header class="top"><div><div class="date num">${dateStr()}</div><div class="cave">${esc(G.cave)}<span class="cavelv">${CAVE_N[G.caveLv||0]}洞天</span><button class="cave-up" onclick="openRenovate()" aria-label="修葺洞天">${(G.caveLv||0)<3?'▲':'◆'}</button></div></div>
   <div class="ap" aria-label="互动点 ${G.ap}/3">${apDots(G.ap)}<span>互动</span></div>
   <button class="icon-btn" aria-label="菜单" onclick="openMenu()">卷</button></header>
  <section class="pcard gf-${p.gender}">
   <div class="pc-top"><div class="seal">${RANK_SEAL[p.rank].split('').join('<br>')}</div><div class="pc-id"><div class="pname">${esc(p.name)}</div><div class="prank">玄天宗 · ${RANKS[p.rank]} · ${p.age}岁 · ${rootName(p.root)}</div></div><div class="realm">${REALMS[p.realm]}</div></div>
   <div class="xp"><div class="bar"><i style="width:${Math.min(100,p.xp/need*100)}%"></i></div><span class="num">${Math.floor(p.xp)}/${need}</span></div>
   ${canBreak()?`<button class="btn redf block" onclick="playerBreak()">瓶颈已至 · 冲击${BREAK[p.realm][1]}（成功率 ${bp}%）</button>`:''}
   <div class="stats"><div class="stat"><b style="${injD(p)?'color:var(--cinnabar)':''}">${Math.floor(hpOf(p))}<span style="font-size:11px;color:var(--ink2)">/${hpMax(p)}</span></b><small>气血${hpWord(p)?'·'+hpWord(p):''}</small></div><div class="stat"><b>${p.jade}</b><small>灵玉</small></div><div class="stat"><b>${pPower()}</b><small>战力</small></div><div class="stat"><b>${p.kpi}<span style="font-size:11px;color:var(--ink2)">/${Math.round(tgt)}</span></b><small>宗门KPI</small></div></div>
   ${p.rank<8&&p.realm<nreq?`<p class="hint">晋升${RANKS_FULL[p.rank+1]}需修为达到 ${REALMS[nreq]}</p>`:''}<div class="heart"><label>动心</label><div class="bar hb"><i style="width:${ht}%"></i></div><span class="num">${Math.floor(ht)}/100</span></div>${ht>=70?`<p class="hint" style="color:var(--cinnabar);margin-top:-4px">道心不稳！再动心就要出事了。服静心丹、闭关或游山玩水可以平复。</p>`:''}
  </section>
  ${evs}${G.secret&&!G.secret.opened?`<div class="event" style="animation:none;border-color:var(--jade)"><span class="seal-s" style="background:var(--jade)">秘</span><span><b style="color:var(--jade)">秘境预告 · ${SECRET[G.secret.id].n}</b><small>${G.secret.openStr} 开启，可入一月 · 推荐${REALMS[SECRET[G.secret.id].diff]}</small></span></div>`:''}
  <section><div class="sec-h"><h2>门下弟子</h2><span>${ds.length}/${mx}</span></div><div class="drow">${cells.join('')}</div></section>
  <section class="actbar"><button class="btn pri big" onclick="openActs()">今日行事</button>
   <div class="minor"><button onclick="openBag('p')">乾坤囊</button><button onclick="openRoster()">师门表</button><button onclick="openMail()">信笺${G.mailBadge?'<i class="dot"></i>':''}</button></div></section>
  <section class="chron"><div class="sec-h"><h2>洞府纪事</h2><button class="link" onclick="openLog()">查看全部</button></div><ul>${G.log.slice(0,6).map(l=>`<li><time>${l.t}</time><span>${l.s}</span></li>`).join('')}</ul></section>`}
function dCard(d){const tag=d.bday?'<span class="tag ok">生辰</span>':d.trek?'<span class="tag">历练</span>':d.away>0?'<span class="tag">外出</span>':hpWord(d)?`<span class="tag warn">${hpWord(d)}</span>`:d.realm>=20?'<span class="tag ok">可出师</span>':'';
  return `<button class="dcard gf-${d.gender}" onclick="openD(${d.id})">${tag}<div class="av">${d.name.slice(-1)}</div><div class="dn">${d.name}</div><div class="dr">${seniorTitle(d)} · ${d.age}岁${d.reborn?(d.reborn==='ds'?' · 夺舍':' · 转世'):''}</div><div class="dr">${REALMS[d.realm]}</div>
  <div class="mini"><span>心情</span><div class="bar s"><i style="width:${d.mood}%"></i></div></div><div class="mini"><span>好感</span><div class="bar s fav"><i style="width:${d.favor}%"></i></div></div></button>`}

// ---------- 徒弟详情 ----------
function moodWord(v){return v>85?'兴奋':v>65?'愉快':v>40?'平静':v>20?'低落':'消沉'}
function openD(id){const d=getD(id);if(!d)return;if(d.status!=='home')return openAlum(id);const need=needXP(d.realm),mk=G.date.y*12+G.date.m;
  const bag=d.bag.length?d.bag.map(x=>{const I=itemInfo(x.k);return `<span class="fate" style="border-color:var(--line);color:var(--ink)">${gd(I.g)}${I.name}×${x.n}</span>`}).join(''):'<span class="hint">空</span>';
  const rels=homeDs().filter(o=>o!==d).map(o=>`<span class="fate" style="border-color:var(--line);color:var(--ink)">${sibName(d,o)} · ${relWord(getRel(d,o))}</span>`).join('')||'<span class="hint">暂无同门</span>';
  const partner=d.partner?getD(d.partner):null;
  modal({title:'弟子名册',html:`
   <div class="dhead gf-${d.gender}"><div class="av lg">${d.name.slice(-1)}</div><div style="min-width:0"><div class="dn">${d.name} <small>${GN[d.gender]} · ${d.age}岁</small></div><div>${seniorTitle(d)} · ${REALMS[d.realm]}</div><div class="hint">生辰 ${d.bm}月${d.bd}日 · 战力 ${dPower(d)}${partner?` · 道侣 ${partner.name}`:''}</div></div></div>
   <div class="barrow"><span>修为</span><div class="bar"><i style="width:${Math.min(100,d.xp/need*100)}%"></i></div><span>${Math.floor(d.xp)}/${need}</span></div>
   <div class="barrow"><span>气血</span><div class="bar hb"><i style="width:${hpPct(d)*100}%"></i></div><span>${Math.floor(hpOf(d))}/${hpMax(d)}${hpWord(d)?' '+hpWord(d):''}</span></div>
   <div class="barrow"><span>心情</span><div class="bar"><i style="width:${d.mood}%"></i></div><span>${moodWord(d.mood)} ${Math.round(d.mood)}</span></div>
   <div class="barrow"><span>好感</span><div class="bar fav"><i style="width:${d.favor}%"></i></div><span>${Math.round(d.favor)}</span></div>
   ${d.child?`<div class="barrow"><span style="color:var(--cinnabar)">亲情</span><div class="bar hb"><i style="width:${d.crush||0}%"></i></div><span>${Math.round(d.crush||0)}</span></div><p class="fdesc">这是你的骨肉（你是${TA(d)}的${d.pRole}）。亲情也计入动心，疼得太过同样危险。</p>`:''}${d.age>=18&&!d.child?`<div class="barrow"><span style="color:var(--cinnabar)">心动</span><div class="bar hb"><i style="width:${d.crush||0}%"></i></div><span>${Math.round(d.crush||0)}</span></div><p class="fdesc">“心动”是你对${TA(d)}的感觉，不是${TA(d)}对你的。</p>`:''}
   <dl class="kv"><dt>灵根</dt><dd>${rootChips(d.root)}</dd><dt>入门</dt><dd>${d.joinDate}</dd>${d.trek?`<dt>状态</dt><dd>奉师命下山${d.trekStyle==='adv'?'历练':'游历'}中（改掉目标即可召回）</dd>`:d.away?`<dt>状态</dt><dd>外出中，约${d.away}日后归来</dd>`:''}</dl>
   <div class="blk"><h4>命格</h4>${d.fates.map(k=>`<div><span class="fate">${FATES[k].n}</span><p class="fdesc">${FATES[k].d}</p></div>`).join('')}</div>
   <div class="blk"><h4>同门</h4>${rels}</div>
   <div class="blk"><h4>本月目标 <span class="hint">（每月可改一次，听不听另说）</span></h4><div class="goals">${Object.entries(GOALS).map(([k,g])=>`<button class="${d.goal===k?'on':''}" ${d.goalMonth===mk&&d.goal!==k?'disabled':''} onclick="setGoal(${id},'${k}')">${g.n}</button>`).join('')}</div><p class="fdesc" style="margin-top:6px">${GOALS[d.goal].d}</p></div>
   <div class="blk"><h4>佩戴法器（${ensureEq(d).length}/3）</h4>${d.eq.length?d.eq.map(k=>{const I=itemInfo(k);return `<span class="fate">${gd(I.g)}${I.name}</span>`}).join(''):'<span class="hint">无</span>'}</div>
   <div class="blk"><h4>乾坤囊 <span class="hint">${GR[d.bagLv||0]}品 · ${bagTotal(d.bag)}/${capStr(DCAP[d.bagLv||0])}</span> ${(d.bagLv||0)<3?`<button class="btn sm" ${G.p.jade<DBAG_COST[(d.bagLv||0)+1]?'disabled':''} onclick="upDBag(${id})">升级 ${DBAG_COST[(d.bagLv||0)+1]}灵玉</button>`:''}</h4>${bag}</div>
   <div class="blk"><h4>近来日程</h4><ul class="dlog">${d.log.slice(0,40).map(l=>`<li><time>${l.t}</time>${l.s}</li>`).join('')}</ul></div>`,
   btns:[{t:'逐出师门',cls:'red',fn:()=>expel(id)},...(d.realm>=20?[{t:'出师',cls:'jade',fn:()=>tryGraduate(id)}]:[]),{t:'召见',cls:'pri',dis:d.away>0,fn:()=>renderInteract(d)}]})}
function renderInteract(d,line,delta,narr){const feast=!!G.feast;const greet=feast?'（举着酒杯走过来）师尊！':d.child&&d.age<6?'（在襁褓里冲你挥着小手）':d.favor<20?'（站在门边，没有走近）……{s}有何吩咐。':d.mood>80?'{s}找我？是有好玩的事吗！':'（行礼）{s}唤弟子何事？';
  const acts=feast?[['chat','闲聊'],['toast','敬酒'],['care','关怀'],['gift','赠予']]:d.child&&d.age<6?[['chat','逗弄'],['care','抱抱'],['gift','赠予']]:[['chat','闲聊'],['spur','督促'],['care','关怀'],['cool','冷落'],['gift','赠予'],['scold','辱骂','danger'],['abuse','责罚','danger']];if(!feast&&(d.sick||injD(d)))acts.unshift(['tend','照料']);const ap=apLeft();
  modal({title:`${feast?'家宴':'召见'} · ${d.name}`,html:`<div class="talk"><div class="av lg gf-${d.gender}">${d.name.slice(-1)}</div><div class="bubble"><span class="who">${d.name}</span>${narr?`<span class="hint" style="display:block;margin-bottom:4px">${narr}</span>`:''}${line!=null?line:(narr?'':fmt(greet,d))}</div></div>
   <div class="delta">${delta||''}</div>
   <div class="ap" style="justify-content:center"><span>剩余${feast?'宴席':''}互动 ${ap}</span></div>
   <div class="igrid">${acts.map(a=>`<button class="${a[2]||''}" ${ap<=0&&a[0]!=='gift'?'disabled':''} onclick="interact(${d.id},'${a[0]}')">${a[1]}</button>`).join('')}${feast?'':`<button onclick="openD(${d.id})">名册</button>`}</div>
   <p class="hint">${feast?'宴席上的互动不占本回合的互动点。':`闲聊能听出${TA(d)}此刻在想什么。赠予不耗互动点。`}</p>`,btns:[{t:feast?'回到席间':'退下',fn:feast?openFeast:closeModal}]})}

// ---------- 乾坤囊 ----------
function openBag(tab='p'){const eq=[0,1,2].map(i=>{const k=G.p.eq[i];if(!k)return `<div class="eq">空位</div>`;const I=itemInfo(k);return `<button class="eq on" onclick="unequip(${i})">${gd(I.g)}${I.name}<br><span class="hint">点击卸下</span></button>`}).join('');
  const list=G.bag.filter(x=>x.k[0]===tab).sort((a,b)=>a.k.localeCompare(b.k));const fx_=pFx();
  const bl=G.bagLv||0,cap=PCAP[bl];
  modal({title:'乾坤囊',html:`<div class="item"><div class="info"><div class="nm">${gd(bl)}乾坤囊 · ${bagTotal(G.bag)}/${capStr(cap)}</div><div class="ds">装满后新得的东西会被挤碎（佩戴中的法器不占位）。</div></div>${bl<3?`<button class="btn sm" ${G.p.jade<BAG_COST[bl+1]?'disabled':''} onclick="upBag()">升${GR[bl+1]}品 ${BAG_COST[bl+1]}</button>`:''}</div><div class="tabs"><button class="${tab==='p'?'on':''}" onclick="openBag('p')">丹药</button><button class="${tab==='f'?'on':''}" onclick="openBag('f')">法器</button></div>
   ${tab==='f'?`<div class="blk"><h4>随身佩戴（${G.p.eq.length}/3）</h4><div class="eqs">${eq}</div><p class="fdesc" style="margin-top:6px">${Object.keys(FX_LABEL).filter(k=>fx_[k]).map(k=>`${FX_LABEL[k]}+${Math.round(fx_[k]*100)}%`).join(' · ')||'尚未佩戴法器'}</p></div>`:`<p class="hint">${G.p.brk?`破境丹药力：下次突破 +${Math.round(G.p.brk*100)}%。`:''}想送给徒弟，请在召见时选「赠予」。要卖东西请去「逛藏宝阁」。</p>`}
   <div class="items">${list.length?list.map(x=>{const I=itemInfo(x.k);return `<div class="item"><div class="info"><div class="nm">${gd(I.g)}${I.name} <span class="ct">×${x.n}</span></div><div class="ds">${I.desc}</div></div>${tab==='p'?`<button class="btn sm" onclick="usePill('${x.k}')">服用</button>`:I.use?`<button class="btn sm" onclick="useSsj('${x.k}')">使用</button>`:`<button class="btn sm" onclick="equip('${x.k}')">佩戴</button>`}${tab==='p'&&x.n>1&&I.kind!=='yh'?`<button class="btn sm" onclick="useAll('${x.k}')">全部</button>`:''}</div>`}).join(''):'<p class="hint">空空如也。</p>'}</div>`})}

// ---------- 行事 ----------
function openActs(){const ds=presentDs();let html='<div class="acts">';

  const hurt=injD(G.p);['idle','teach',hurt?null:'cult','market','alch','task','explore',hurt?'heal':'seclude'].filter(Boolean).forEach(k=>{let dis=false,note='';if(k==='teach'&&!ds.length){dis=true;note='（门下无人）'}html+=actBtn(k,dis,note)});if(hurt)html+=`<p class="hint" style="color:var(--cinnabar)">你${sevD(G.p)?'身受重伤':'有伤在身'}（气血 ${Math.floor(hpOf(G.p))}/${hpMax(G.p)}），无法修炼与闭关。</p>`;
  html+='</div>';modal({title:'今日行事',html})}
function actBtn(k,dis,note=''){const A=ACTS[k];const fn=k==='renovate'?'openRenovate()':k==='alch'?'openAlch()':k==='explore'?'openExplore()':k==='task'?'openTasks()':k==='seclude'||k==='heal'?`openDays('${k}')`:`doAct('${k}')`;return `<button class="act" ${dis?'disabled':''} onclick="${fn}"><b>${A.n}</b><em>${A.days?A.days+'日':'自选'}</em><p>${A.desc}${note}</p></button>`}
let DAYS_SEL=30;
function missedFest(days){const out=[];let t={...G.date};const so=G.secret&&!G.secret.opened?G.secret.open:-1;for(let i=0;i<days;i++){t=addDays(t,1);const f=FEST_DATES.find(x=>x[0]===t.m&&x[1]===t.d);if(f)out.push(`${t.y}年${t.m}月${t.d}日 ${f[2]}`);G.ds.forEach(x=>{if(['home','grad'].includes(x.status)&&x.bm===t.m&&x.bd===t.d)out.push(`${t.y}年${t.m}月${t.d}日 ${x.name}生辰`)});if(dn(t)===so)out.push(`${t.y}年${t.m}月${t.d}日 秘境「${SECRET[G.secret.id].n}」开启`)}const back=dn(t);G.events.forEach(e=>{if(e.until<back)out.unshift(`${e.label}（${e.untilStr}截止，正在进行）`)});return out}
function openDays(kind){const heal=kind==='heal';const lo=heal?5:30,hi=heal?100:300;const d=clamp(DAYS_SEL,lo,hi);const miss=missedFest(d);
  modal({title:heal?'静养':'闭关',html:`<p class="hint">${heal?'有伤在身无法修炼。静养期间气血恢复更快，也能平复动心。':'闭关期间修为大涨、动心平复，但无法管教徒弟，宗门大事也会错过。'}</p>
   <div class="goals">${(heal?[5,15,30]:[30,100,300]).map(n=>`<button class="${d===n?'on':''}" onclick="DAYS_SEL=${n};openDays('${kind}')">${n}天</button>`).join('')}</div>
   <div class="field"><label class="l" for="days-in">天数（${lo}～${hi}）</label><input type="number" id="days-in" min="${lo}" max="${hi}" value="${d}" onchange="DAYS_SEL=clamp(parseInt(this.value)||${lo},${lo},${hi});openDays('${kind}')"></div>
   <dl class="kv"><dt>预计</dt><dd>${heal?`气血 ${Math.floor(hpOf(G.p))}/${hpMax(G.p)}，每日恢复较快`:`修为约 +${Math.round(pGain()*d*1.2)}`}</dd><dt>归来</dt><dd>${dateStr(addDays(G.date,d))}</dd></dl>
   ${miss.length?`<div class="confirm-box"><p>这段时间会错过：</p><p class="hint">${miss.join('<br>')}</p></div>`:''}`,
   btns:[{t:'返回',fn:openActs},{t:heal?'静养':'闭关',cls:'pri',fn:()=>doAct(kind,{days:clamp(parseInt(($('#days-in')||{}).value)||d,lo,hi)})}]})}
let ALCH={kind:'jq',g:0};
function alchDays(kind,g){const P=PILLS[kind];return P.only!=null?P.days:Math.round(P.days*(1+.5*g))}
function openAlch(){const r=G.p.realm,maxG=r>=35?3:r>=25?2:r>=15?1:0;const P=PILLS[ALCH.kind];if(P.only!=null)ALCH.g=P.only;else ALCH.g=Math.min(ALCH.g,maxG);const help=homeDs().reduce((s,d)=>s+(fx(d).alchHelp||0),0);
  const k=`p:${ALCH.kind}:${ALCH.g}`,I=itemInfo(k),cost=Math.round(I.price*.8),locked=P.only===3&&r<25,p=clamp(.65+(pFx().alch||0)+help-ALCH.g*.12,.1,.95),days=alchDays(ALCH.kind,ALCH.g);ALCH.p=p;const miss=missedFest(days);
  modal({title:'开炉炼丹',html:`<div class="blk"><h4>丹方</h4><div class="goals">${Object.entries(PILLS).filter(([kk,Q])=>!Q.hidden).map(([kk,Q])=>`<button class="${ALCH.kind===kk?'on':''}" onclick="ALCH.kind='${kk}';openAlch()">${Q.n}</button>`).join('')}</div></div>
   ${P.only==null?`<div class="blk"><h4>品阶</h4><div class="goals">${GR.map((g,i)=>`<button class="${ALCH.g===i?'on':''}" ${i>maxG?'disabled':''} onclick="ALCH.g=${i};openAlch()">${g}品${i>maxG?'（境界不足）':''}</button>`).join('')}</div></div>`:''}
   <div class="item"><div class="info"><div class="nm">${gd(I.g)}${I.name}</div><div class="ds">${I.desc}</div></div></div>
   <dl class="kv"><dt>耗费</dt><dd>灵玉 ${cost}（现有 ${G.p.jade}）</dd><dt>成丹率</dt><dd>${Math.round(p*100)}%${help?'（有徒弟帮忙看火）':''}</dd><dt>产出</dt><dd>${ALCH.kind==='xs'?'1 枚':'2～4 枚'}</dd><dt>耗时</dt><dd>${days} 日</dd></dl>
   ${locked?'<p class="hint" style="color:var(--cinnabar)">洗髓丹需化神期以上才能炼制。</p>':''}${miss.length?`<p class="hint">炼丹期间会错过：${miss.join('、')}</p>`:''}`,
   btns:[{t:'返回',fn:openActs},{t:'开炉',cls:'pri',dis:G.p.jade<cost||locked,fn:()=>{G.p.jade-=cost;ACTS.alch.days=days;doAct('alch',{k,p,days})}}]})}
function refreshShop(){const r=G.p.realm;G.shop=[];for(let i=0;i<6;i++){const k=randPill(rollGrade(r));G.shop.push({k,n:ri(1,4)})}G.shop.push({k:'p:yh:0',n:ri(0,2)});if(chance(.12))G.shop.push({k:'f:ssj',n:1});for(let i=0;i<2;i++)G.shop.push({k:randFaqi(rollGrade(r)),n:1})}

function runEvent(i){const e=G.events[i];if(!e)return;e.touched=true;({recruit:openRecruit,tourney:openTourney,newyear:openNewYear,qingming:openQingming,mid:openFeastPrep,auction:openAuction,secret:openSecret})[e.k](e)}

let TJOIN=true;
function openTourney(e){const ds=presentDs();modal({title:'宗门大比',html:`<p class="prose">三月初一，宗门大比。弟子组凡在门弟子必须参加；长老组自愿报名。</p>
  <div class="blk"><h4>参赛弟子（${ds.length}人）</h4>${ds.length?ds.map(d=>`<span class="fate" style="border-color:var(--line);color:var(--ink)">${d.name} · 战力${dPower(d)}</span>`).join(''):'<span class="hint">门下无人在山上</span>'}</div>
  <div class="blk"><h4>长老组</h4><div class="goals"><button class="${TJOIN?'on':''}" onclick="TJOIN=true;openTourney(G.events.find(x=>x.k==='tourney'))">报名参加（战力 ${pPower()}）</button><button class="${!TJOIN?'on':''}" onclick="TJOIN=false;openTourney(G.events.find(x=>x.k==='tourney'))">不参加</button></div></div>
  <p class="hint">名次好有KPI与奖励，名次差会扣KPI。</p>`,btns:[{t:'稍后',fn:closeModal},{t:'开赛',cls:'pri',fn:()=>runTourney(e)}]})}
function runTourney(e){e.done=true;endEvent(e);const ds=presentDs();let kpi=0;const rows=ds.map(d=>{const score=dPower(d)*(.8+R()*.45);const base=basePow(4+(d.age-13)*1.4);let t;
    if(score>base*1.8){kpi+=12;const k=randFaqi(Math.min(3,rollGrade(G.p.realm)+1));addItem(d.bag,k);t=`夺得魁首！宗门赏${itemInfo(k).name}`;d.mood+=15;d.favor+=5;unlock('dchamp')}
    else if(score>base*1.15){kpi+=5;addItem(d.bag,'p:jq:1');t='跻身前十，得玄品聚气丹';d.mood+=6}
    else if(score>base*.75){t='名列中游';d.mood-=2}
    else{kpi-=4;t='首轮即败，垫底';d.mood-=10}clampD(d);logD(d,`宗门大比：${t}。`);return `<li><b>${d.name}</b>：${t}</li>`});
  let prow='';if(TJOIN){const sc=pPower()*(.85+R()*.35),eb=basePow(20+G.p.rank*2.2);if(sc>eb*1.5){kpi+=12;const k=randFaqi(Math.min(3,rollGrade(G.p.realm)+1));addItem(G.bag,k);G.p.jade+=300;prow=`你力压群雄，夺得长老组魁首！得${itemInfo(k).name}与灵玉300。`;unlock('champion');homeDs().forEach(d=>{d.favor+=3;clampD(d)})}else if(sc>eb*1.1){kpi+=6;G.p.jade+=120;prow='你位列长老组三甲，得灵玉120。'}else if(sc>eb*.8){prow='你在长老组中规中矩。'}else{kpi-=5;prow='你在长老组首轮落败，颜面扫地。';homeDs().forEach(d=>{d.mood-=3;clampD(d)})}}
  G.p.kpi+=kpi;log(`宗门大比结束，KPI ${kpi>=0?'+':''}${kpi}。`);modal({title:'大比结果',html:`<ul class="dlog" style="max-height:none;font-size:14px">${rows.join('')||'<li>门下无人参赛</li>'}</ul>${prow?`<p class="prose">${prow}</p>`:''}<p class="hint">宗门KPI ${kpi>=0?'+':''}${kpi}</p>`,btns:[{t:'知道了',cls:'pri',fn:closeModal}]})}

const RP=[0,66,188,666,1888];
function openNewYear(e){e.rp=e.rp||{};const list=G.ds.filter(d=>d.status==='home'||d.status==='grad');const tot=list.reduce((s,d)=>s+RP[e.rp[d.id]||0],0);

function giveRed(e,list,tot){G.p.jade-=tot;e.rpDone=true;const tiers=list.map(d=>e.rp[d.id]||0);const mx=Math.max(...tiers);const lines=[];

let AUC_MSG='';
function openAuction(e){const i=e.lots.findIndex(l=>!l.sold);if(i<0){return modal({title:'藏宝阁大促',html:'<p class="prose">今年的拍卖结束了。</p>',btns:[{t:'离开',cls:'pri',fn:()=>{endEvent(e);closeModal()}}]})}const l=e.lots[i],I=itemInfo(l.k);
  modal({title:`藏宝阁大促 · 第${i+1}件`,html:`<div class="item"><div class="info"><div class="nm">${gd(I.g)}${I.name}${l.n>1?' ×'+l.n:''}</div><div class="ds">${I.desc}</div></div></div>
   <dl class="kv"><dt>底价</dt><dd>${l.b} 灵玉</dd><dt>当前价</dt><dd><b>${l.price}</b> 灵玉</dd><dt>领先</dt><dd>${l.lead==='you'?'你':l.lead||'暂无'}</dd><dt>你的灵玉</dt><dd>${G.p.jade}</dd></dl>
   ${AUC_MSG?`<p class="prose">${AUC_MSG}</p>`:''}<p class="hint">出价后若无人跟价即成交；有人跟价可以继续加，也可以放弃。</p>`,
   btns:[{t:'放弃此件',fn:()=>{l.sold=true;AUC_MSG=l.lead&&l.lead!=='you'?`${l.lead}以 ${l.price} 灵玉拍走了${I.name}。`:`${I.name}流拍了。`;openAuction(e)}},{t:`出价 ${Math.round(l.price*1.1)}`,cls:'pri',dis:G.p.jade<Math.round(l.price*1.1),fn:()=>bid(e,l,1.1)},{t:`加价 ${Math.round(l.price*1.3)}`,dis:G.p.jade<Math.round(l.price*1.3),fn:()=>bid(e,l,1.3)}]})}
function bid(e,l,mul){const I=itemInfo(l.k);l.price=Math.round(l.price*mul);l.lead='you';const p=clamp(1.25-l.price/l.val,0,.85);
  if(chance(p)){const who=pick(NPC_BIDDERS);l.price=Math.round(l.price*1.1);l.lead=who;AUC_MSG=`${who}举牌：“${l.price}！”`}
  else{G.p.jade-=l.price;addItem(G.bag,l.k,l.n);l.sold=true;if(I.g===3)unlock('auction');log(`在藏宝阁以 ${l.price} 灵玉拍得${I.name}。`);AUC_MSG=`一锤定音！你以 ${l.price} 灵玉拍下了${I.name}。`}
  openAuction(e)}

const ST_NAME={home:'在门',grad:'已出师',dead:'已陨落',nemesis:'叛离',demon:'堕魔',expelled:'逐出',mortal:'寄养凡间'};
function openRoster(tab='home'){const groups={home:d=>d.status==='home',grad:d=>d.status==='grad',gone:d=>!['home','grad'].includes(d.status)};const list=G.ds.filter(groups[tab]).sort((a,b)=>a.seq-b.seq);
  modal({title:'师门表',html:`<div class="tabs"><button class="${tab==='home'?'on':''}" onclick="openRoster('home')">在门</button><button class="${tab==='grad'?'on':''}" onclick="openRoster('grad')">出师</button><button class="${tab==='gone'?'on':''}" onclick="openRoster('gone')">离散</button></div>
   <p class="hint">共收徒 ${G.stats.recruited} 人，出师 ${G.stats.grads} 人。按入门先后排序。</p>
   <div class="items">${list.length?list.map(d=>`<button class="roster-row gf-${d.gender}" onclick="openAlum(${d.id})"><div class="av">${d.name.slice(-1)}</div><div><b>${d.name}</b><small>${d.seq?seniorTitle(d)+' · ':''}${REALMS[d.realm]}${d.status==='grad'?' · '+CAREERS[d.career].n:''}${d.child?' · 你的孩子':''}</small></div><span class="st-tag">${d.reborn?(d.reborn==='ds'?'夺舍·':'转世·'):''}${ST_NAME[d.status]}</span></button>`).join(''):'<p class="hint">暂无。</p>'}</div>`})}
function openAlum(id){const d=getD(id);if(d.status==='home')return openD(id);

   ${d.status==='grad'?`<div class="barrow"><span>好感</span><div class="bar fav"><i style="width:${d.favor}%"></i></div><span>${Math.round(d.favor)}</span></div>${d.age>=18?`<div class="barrow"><span style="color:var(--cinnabar)">心动</span><div class="bar hb"><i style="width:${d.crush||0}%"></i></div><span>${Math.round(d.crush||0)}</span></div>`:''}`:''}
   <dl class="kv"><dt>灵根</dt><dd>${rootChips(d.root)}</dd><dt>入门</dt><dd>${d.joinDate}</dd><dt>命格</dt><dd>${d.fates.map(k=>`<span class="fate">${FATES[k].n}</span>`).join('')}</dd></dl>
   <div class="blk"><h4>${d.status==='grad'?'近况':'生平'}</h4><ul class="dlog" style="max-height:300px">${d.log.slice(0,50).map(l=>`<li><time>${l.t}</time>${l.s}</li>`).join('')}</ul></div>`,btns:[{t:'返回师门表',fn:()=>openRoster(d.status==='grad'?'grad':'gone')},...(['grad','expelled'].includes(d.status)?[{t:'寄信赠礼',cls:'pri',fn:()=>openParcel(id,true)}]:[]),...(['nemesis','demon'].includes(d.status)?[{t:'前去寻访（30日）',cls:'red',fn:()=>visitRogue(id)}]:isRogue(d)?[{t:'前去讨伐（10日）',cls:'red',fn:()=>huntRogue(id)}]:[]),...(d.status==='mortal'?[{t:freeSlots()>0?'接回洞府':'弟子位已满',cls:'pri',dis:freeSlots()<=0,fn:()=>receiveChild(id)}]:[])]})}
const mailHtml=m=>`<div class="mail"><b>${m.from}</b> <span class="hint">（${m.career}）· ${m.t}</span><div class="prose" style="font-size:13px">${m.html||`<p>“${m.msg||''}”</p>`}</div><div class="att">随信附上：${m.att}</div>${m.did?(m.replied?`<p class="hint">已回信（${m.replied}）</p>`:`<div class="goals" style="margin-top:6px"><button onclick="replyMail(${m.id},true);openMail()">温情回信</button><button onclick="replyMail(${m.id},false);openMail()">公事公办</button></div>`):''}</div>`;
function openMail(){G.mailBadge=false;modal({title:'信笺',html:`<p class="hint">回信不耗时间。温情回信会让出师的弟子更挂念你，也可能让你更心动。</p>`+(G.mail.length?G.mail.slice(0,50).map(mailHtml).join(''):'<p class="hint">还没有来信。出师的弟子会不时寄信回来。</p>')})}

  ${bgmBlock()}<div class="blk"><h4>提示</h4><div class="goals" style="flex-direction:column;align-items:stretch">${[['bday','徒弟生辰'],['sick','徒弟生病 / 康复']].map(([k,n])=>`<button class="${PREF[k]!==false?'on':''}" onclick="PREF.${k}=PREF.${k}===false;savePref();openMenu()">${n}提醒：${PREF[k]!==false?'开':'关'}</button>`).join('')}</div><p class="fdesc" style="margin-top:6px">关闭后不再弹窗，只记在近来日程里。生病的弟子仍会显示在右上角。</p></div><p class="hint">进度会自动保存在本浏览器中。图鉴跨存档保留。</p>${confirm?`<div class="confirm-box"><p>确定放弃当前存档、重新入道吗？</p><button class="btn redf" onclick="restart()">确定重来</button></div>`:''}`,
  btns:[{t:'图鉴',fn:()=>openCodex('fate')},{t:'洞府指南',fn:showGuide},{t:'重新开始',cls:'red',fn:()=>openMenu(true)}]})}
function openCodex(tab){const T={fate:'命格',end:'结局',ach:'成就'};let body='';
  if(tab==='fate'){const all=Object.keys(FATES);body=`<p class="hint">已收录 ${CODEX.fates.length}/${all.length}</p><div class="items">${all.map(k=>CODEX.fates.includes(k)?`<div class="item"><div class="info"><div class="nm"><span class="fate">${FATES[k].n}</span></div><div class="ds">${FATES[k].d}</div></div></div>`:`<div class="item"><div class="info"><div class="nm hint">？？？</div><div class="ds">尚未收过拥有此命格的弟子</div></div></div>`).join('')}</div>`}
  else if(tab==='end'){const all=Object.keys(ENDINGS);body=`<p class="hint">已达成 ${CODEX.endings.length}/${all.length}</p><div class="items">${all.map(k=>`<div class="item"><div class="info"><div class="nm">${CODEX.endings.includes(k)?ENDINGS[k].t:'？？？'}</div><div class="ds">${CODEX.endings.includes(k)?ACH[k].d:'尚未达成'}</div></div></div>`).join('')}</div>`}
  else{const all=Object.keys(ACH);body=`<p class="hint">已解锁 ${CODEX.ach.length}/${all.length}</p><div class="items">${all.map(k=>`<div class="item"><div class="info"><div class="nm">${CODEX.ach.includes(k)?ACH[k].n:'？？？'}</div><div class="ds">${CODEX.ach.includes(k)?ACH[k].d:'尚未解锁'}</div></div></div>`).join('')}</div>`}
  modal({title:'图鉴',html:`<div class="tabs">${Object.entries(T).map(([k,v])=>`<button class="${tab===k?'on':''}" onclick="openCodex('${k}')">${v}</button>`).join('')}</div>${body}`})}
function restart(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}G=null;S=null;hideModal();renderSetup()}
function backToTitle(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}G=null;S=null;hideModal();renderTitle()}

G=null;render();

function fateEff(d,e,sib){const T=MB[d.mbti];
  switch(e){case'xp':addDXP(d,needXP(d.realm)*.015);break;case'xp2':addDXP(d,needXP(d.realm)*.04);break;

  case'gift':{const k=randPill(rollGrade(d.realm));addItem(G.bag,k);log(`${d.name}孝敬了你一枚${itemInfo(k).name}。`);break}
  case'jade':{const v=ri(10,50);G.p.jade+=v;log(`${d.name}送来灵玉 ${v}。`);break}
  case'relp':if(sib)addRel(d,sib,3);break;case'relm':if(sib){addRel(d,sib,-3);sib.mood-=3;clampD(sib)}break;
  case'hurtsib':if(sib){addRel(d,sib,-2);if(chance(.3)){hurtD(sib,ri(3,10));sib.notes.push(`莫名其妙地受了点轻伤`)}}break;
  case'allmood':presentDs().forEach(o=>{if(o!==d){o.mood+=3;clampD(o)}});break;
  case'hurt':hurtD(d,ri(5,15));break;case'cliff':hurtD(d,ri(10,25));if(d.status!=='dead')addDXP(d,needXP(d.realm)*.06);break;
  case'beast':d.beasts=(d.beasts||0)+1;break}}
function fateDay(d){if(d.status!=='home'||(d.child&&d.age<6))return;d.fates.forEach(k=>{const L=FATE_SCHED[k];if(!L||!chance(.03))return;const sib=pickSib(d);const effs=(FATE_EFF[k]||'xp').split(' ');fateEff(d,pick(effs),sib);if(d.status==='dead')return;
  let t=pick(L);if(/\{sib\}/.test(t)&&!sib)t=pick(L.filter(x=>!/\{sib\}/.test(x)))||t.replace(/\{sib\}/g,'同门');d.notes.push(fmt(t,d,sib).replace(/\{k\}/g,Math.max(1,d.beasts||1)));clampD(d)})}

    if(st==='hate'&&d.demon>=50){if(gs.length&&chance(.5)){const y=pick(gs);F.lines.push(`<br><b style="color:var(--cinnabar)">${d.name}闯进了家宴，直奔${y.name}而去！</b>${fmt(rogueHitsDisciple(d,y),d)}`)}else{gs.forEach(x=>{x.mood-=8;clampD(x)});G.p.kpi-=5;F.lines.push(`<br><b style="color:var(--cinnabar)">${d.name}一脚踹翻了宴桌，杯盘碎了一地：“团圆？我也是你的弟子，凭什么没有我的位置？”</b>（宗门KPI -5）`)}return}
    F.guests.push(d.id);F.ap++;
    if(st==='obsess'){gs.forEach(x=>{x.mood-=4;addRel(x,d,-4);clampD(x)});addHeart(5,d);F.lines.push(`<br>${d.name}不知何时出现，旁若无人地坐到了你身边，替你斟满了酒。满座的人都不敢出声。`)}
    else if(st==='love'){d.favor+=3;addHeart(3,d);F.lines.push(`<br>席末多了一个人——是${d.name}。${TA(d)}没说话，只是远远看着你，面前的酒一口没动。`)}
    else if(st==='hate'){gs.forEach(x=>{x.mood-=3;clampD(x)});F.lines.push(`<br>${d.name}冷着脸坐在角落，一言不发，气氛僵得能结冰。`)}
    else F.lines.push(`<br>${d.name}${pick(['悄悄来了，在檐下站了一会儿，像是在犹豫要不要进来。','拎着一坛酒来了，放下就坐到了最边上。','来了。和谁都没打招呼，只敬了你一杯。'])}`)});
  if(changed)openFeast()};
// —— 叛离弟子的生辰贺礼 ——
const _pbday13=EV.pbday;
EV.pbday=function(){_pbday13();const add=[];G.ds.filter(d=>isNem(d)&&(d.favor>=30||d.love>=50)&&chance(.5)).forEach(d=>{let att;if(chance(.5)){const v=Math.round(ri(40,150)*(1+d.realm/25));G.p.jade+=v;att=`灵玉 ×${v}`}else{const k=chance(.3)?randFaqi(rollGrade(d.realm)):randPill(rollGrade(d.realm));addItem(G.bag,k);att=itemInfo(k).name}
  logD(d,`师尊生辰，托人送去${att}。`);log(`叛出师门的${d.name}送来生辰贺礼：${att}。`);add.push(`叛出师门的${d.name}${pick(['托一只黑鸦','让一个陌生的小童','趁夜在门口'])}送来${att}，${pick(['没有留名，可你认得那字迹。','只附了四个字：“生辰快乐。”','附言：“别多想。顺手而已。”','什么话也没留。'])}`)});
  const ul=document.querySelector('#modal .dlog');if(ul&&add.length)ul.insertAdjacentHTML('beforeend',add.map(x=>`<li>${x}</li>`).join(''));save()};
// —— 主动找上门：下药、爬床、纠缠、撒娇、闯关、山下相遇 ——
const COAX={NT:'叛出师门的{d}忽然出现在洞府门口，抱着手臂别别扭扭：“……路过。顺便看看你死了没有。”说完却没走，耳尖红了。',NF:'{d}不知何时溜了进来，拽着你的袖子不撒手：“{s}，就一会儿，让我待一会儿好不好？”',SJ:'{d}在门外规规矩矩地跪着，像从前一样替你煮好了茶：“弟子知道没资格……只是今日风大，想给{s}煮壶热茶。”',SP:'{d}翻墙进来，往你身边的蒲团上一倒：“外面好冷，{s}收留我一晚嘛——就一晚！”'};
EV.ncoax=e=>{const d=getD(e.id);if(!isNem(d))return nextEvent();evModal('不速之客',`<p class="prose">${fmt(COAX[MB[d.mbti].g],d)}</p>`,[
  opt('让'+TA(d)+'留一会儿',()=>{d.favor+=5;addLove(d,3);addHeart(8,d);d.demon-=4;clampD(d);logD(d,'偷偷回去看了师尊，被留了一会儿。');result('{d}在你身边待到天快亮，走的时候一步三回头。',d)}),
  opt('摸摸'+TA(d)+'的头',()=>{d.favor+=8;addLove(d,4);addHeart(12,d);d.demon-=6;clampD(d);result('{d}僵住了，然后把脸埋进你的袖子里，很久没有抬起来。',d)},false,'red'),
  opt('冷着脸赶走',()=>{d.favor-=5;d.demon+=5*MB[d.mbti].dark;clampD(d);result('{d}的笑一点点淡下去：“……知道了。”',d)})])};
EV.nbreak=e=>{const d=getD(e.id);if(!isNem(d))return nextEvent();const st=nemState(d);const intro=st==='hate'?`闭关正到紧要处，洞府的禁制忽然被一剑劈开——${d.name}提剑闯了进来：“{s}倒是清闲。”`:st==='cold'?`闭关时，你察觉有人破开了外围禁制。是${d.name}。${TA(d)}站在洞口看了你很久，什么也没做。`:`闭关第${ri(20,200)}日，洞府禁制被人一层层解开。${d.name}走了进来，在你面前蹲下：“{s}闭关这么久，就不想我吗？”`;
  evModal('闯关',`<p class="prose">${intro.replace('{s}','师尊')}</p>`,[
   opt('强行出关',()=>{hurtP(ri(5,12));if(G.over)return;if(st==='hate'){const r=duel(d);if(r==='dead')return;result('真气逆行，你还是睁开了眼。<br>'+duelText(r,d),d)}else{addHeart(st==='cold'?2:10,d);d.favor+=3;clampD(d);result('真气逆行，你还是睁开了眼。{d}看着你，像是终于等到了什么。',d)}},false,'red'),
   opt('不理会，继续闭关',()=>{if(st==='obsess'&&chance(.35))return capture(d,`你没有睁眼。{d}笑了一声，抬手在你周身落下一道道禁制：“那就别出来了。”`.replace('{d}',d.name));const lost=Math.round(needP(G.p.realm)*.05);G.p.xp=Math.max(0,G.p.xp-lost);if(st==='hate'){hurtP(ri(10,25),d);if(G.over)return}result(st==='hate'?'{d}砸了你半座洞府，扬长而去。你受了点伤，修为也折损了些。':'{d}在你身边坐了很久，最后叹了口气，走了。你心神不宁，修为折损了些。',d)}),
   opt('以阵法困住'+TA(d),()=>{if(chance(powCheck(pPower(),dPower(d)))){d.demon+=5;clampD(d);result('阵光亮起，{d}被你困了三日。放出来时，{ta}一句话也没说就走了。',d)}else{hurtP(ri(10,20),d);if(G.over)return;result('阵法被{d}一剑斩破。',d)}})])};
EV.nfind=e=>{const d=getD(e.id);if(!isNem(d))return nextEvent();const st=nemState(d);
  if(st==='hate'){return evModal('山下遇敌',`<p class="prose">下山途中，${d.name}截住了你：“{s}离了洞府，倒是方便我动手。”</p>`.replace('{s}','师尊'),[opt('迎战',()=>{const r=duel(d);if(r==='dead')return;result(duelText(r,d),d)},false,'red'),opt('遁走',()=>{hurtP(10,d);if(G.over)return;result('你化作一道剑光遁走。',d)})])}
  const txt=st==='cold'?`山下的茶楼里，你一抬头，看见${d.name}坐在对面。${TA(d)}没过来，只是隔着人群，朝你举了举杯。`:`你在山下的集市上走着，有人从身后拽住了你的袖子——是${d.name}。“{s}下山也不叫我。”${TA(d)}说得理直气壮，好像从没离开过。`.replace('{s}','师尊');
  evModal('山下重逢',`<p class="prose">${txt}</p>`,[opt('同行一段',()=>{d.favor+=5;if(st!=='cold'){addLove(d,3);addHeart(st==='obsess'?12:8,d)}d.demon-=3;clampD(d);logD(d,'在山下遇见了师尊，同行了一段路。');result('你们走了一段路。分开时，{d}站在原地，一直看着你走远。',d)}),
   opt('说几句话',()=>{G.nemMeet={id:d.id,ap:2};openNemTalk(d)}),opt('装作没看见',()=>{d.favor-=3;d.demon+=2;clampD(d);result('你转身离开。身后很久都没有脚步声。',d)})])};
const _extMonth13=extMonth;
extMonth=function(){_extMonth13();G.ds.forEach(d=>{if(!isNem(d)||d.age<18||G.queue.some(e=>e.id===d.id))return;const st=nemState(d);
  if((st==='love'||st==='obsess')&&chance(st==='obsess'?.05:.03))G.queue.push({k:'dark',id:d.id,kind:pick(st==='obsess'?['drug','bed','cage','cage']:['drug','bed'])});
  else if(st!=='hate'&&d.favor>=30&&d.demon<70&&chance(.04))G.queue.push({k:'ncoax',id:d.id})})};
const _simDay13=simDay;
simDay=function(){_simDay13();if(!G||G.over)return;if(G.secluding&&!G.breakQ){const c=G.ds.filter(d=>isNem(d)&&d.age>=18&&chance(nemState(d)==='cold'?.0008:nemState(d)==='hate'?(d.demon>=50?.002:0):.003));if(c.length){G.breakQ=true;G.queue.push({k:'nbreak',id:c[0].id})}}
  if(G.exploring&&!G.findQ){const c=G.ds.filter(d=>isNem(d)&&d.age>=18&&chance(.004));if(c.length){G.findQ=true;G.queue.push({k:'nfind',id:c[0].id})}}};
const _preSec13=ACT_PRE.seclude;ACT_PRE.seclude=function(a,b){G.breakQ=false;return _preSec13(a,b)};
const _preExp13=ACT_PRE.explore;ACT_PRE.explore=function(days,o){G.exploring=true;G.findQ=false;return _preExp13?_preExp13(days,o):undefined};
const _endExp13=ACT_END.explore;ACT_END.explore=function(a,b){G.exploring=false;return _endExp13(a,b)};
// 叛离弟子不会就这样怀上孩子
const _acceptBed13=acceptBed;acceptBed=function(d){const had=!!G.preg;_acceptBed13(d);if(!had&&G.preg&&isNem(d)&&G.preg.carrier===d.id)G.preg=null};
</script>
