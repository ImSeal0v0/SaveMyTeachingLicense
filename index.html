<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>无情道教资保卫战</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=ZCOOL+XiaoWei&display=swap">
<style>
/* Layout: one portrait column like a hanging scroll — date strip, the master's name-plate, a row of disciple seats, the day's action bar, then the cave chronicle */
:root{
  --paper:#e6ebe4; --paper2:#f4f6f1; --mist:#d3ded6; --ink:#1d2320; --ink2:#59625c; --line:#c3cbc2;
  --jade:#2c6b5a; --jade-soft:#d2e3da; --cinnabar:#b0392b; --gold:#97762a;
  --male:#d4e5f5; --female:#f6d6da; --maleEdge:#6b98c4; --femaleEdge:#c97c88;
  --scrim:rgba(18,24,21,.5); --shadow:rgba(25,35,30,.14);
  --g0:#9a7b3a; --g1:#3d4f73; --g2:#7b4a2a; --g3:#b5832a;
  --f-disp:'ZCOOL XiaoWei','Noto Serif SC','Songti SC','STSong',serif;
  --f-body:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111614; --paper2:#1a201d; --mist:#1c2a24; --ink:#e2e8e2; --ink2:#98a39b; --line:#2e3a34;
  --jade:#72b8a1; --jade-soft:#1d3a30; --cinnabar:#e07462; --gold:#d6b46a;
  --male:#1c3247; --female:#43262e; --maleEdge:#6f9dcb; --femaleEdge:#d68c98;
  --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.4);
  --g0:#c9a865; --g1:#8fa3d6; --g2:#c48a62; --g3:#e8b85a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111614; --paper2:#1a201d; --mist:#1c2a24; --ink:#e2e8e2; --ink2:#98a39b; --line:#2e3a34;
  --jade:#72b8a1; --jade-soft:#1d3a30; --cinnabar:#e07462; --gold:#d6b46a;
  --male:#1c3247; --female:#43262e; --maleEdge:#6f9dcb; --femaleEdge:#d68c98;
  --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.4);
  --g0:#c9a865; --g1:#8fa3d6; --g2:#c48a62; --g3:#e8b85a; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);background-image:radial-gradient(ellipse 120% 50% at 50% 0,var(--mist),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
#app{max-width:460px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{border:1px solid var(--ink);background:transparent;padding:10px 14px;border-radius:6px;font-size:15px;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ink);color:var(--paper2)}
.btn.red{border-color:var(--cinnabar);color:var(--cinnabar)}
.btn.redf{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff}
.btn.jade{border-color:var(--jade);color:var(--jade)}
.btn.block{width:100%}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.link{background:none;border:none;color:var(--jade);font-size:13px;padding:2px 0}

/* gender frames */
.gf-m{background:var(--male);border-color:var(--maleEdge)!important}
.gf-f{background:var(--female);border-color:var(--femaleEdge)!important}
.gf-futa{background:linear-gradient(90deg,var(--female) 0%,var(--female) 42%,var(--male) 58%,var(--male) 100%);border-color:var(--femaleEdge) var(--maleEdge) var(--maleEdge) var(--femaleEdge)!important}
.gf-inter{background:linear-gradient(90deg,var(--male) 0%,var(--male) 42%,var(--female) 58%,var(--female) 100%);border-color:var(--maleEdge) var(--femaleEdge) var(--femaleEdge) var(--maleEdge)!important}

/* top strip */
.top{display:flex;align-items:center;gap:12px}
.top .date{font-size:12px;color:var(--ink2);letter-spacing:.05em}
.top .cave{font-family:var(--f-disp);font-size:24px;line-height:1.2}
.top>div:first-child{flex:1;min-width:0}
.ap{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2)}
.ap i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--jade);display:inline-block}
.ap i.on{background:var(--jade)}
.ap span{margin-left:2px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--ink);background:var(--paper2);font-family:var(--f-disp);font-size:17px}

/* player card */
.pcard{border:2px solid;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 18px var(--shadow)}
.pc-top{display:flex;align-items:center;gap:12px}
.seal{width:46px;height:46px;flex:none;background:var(--cinnabar);color:#fff;font-family:var(--f-disp);font-size:17px;line-height:1.05;display:grid;place-items:center;text-align:center;border-radius:5px;padding:3px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.pc-id{flex:1;min-width:0}
.pname{font-family:var(--f-disp);font-size:24px;line-height:1.15}
.prank{font-size:12px;color:var(--ink2)}
.realm{font-family:var(--f-disp);font-size:18px;writing-mode:vertical-rl;letter-spacing:.1em;border-left:1px solid var(--ink2);padding-left:8px;max-height:96px}
.xp{display:flex;align-items:center;gap:8px;font-size:12px}
.xp .bar{flex:1}
.bar{height:8px;background:rgba(0,0,0,.1);border-radius:4px;overflow:hidden}
:root[data-theme="dark"] .bar{background:rgba(255,255,255,.1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar{background:rgba(255,255,255,.1)}}
.bar i{display:block;height:100%;background:var(--jade);border-radius:4px;transition:width .4s}
.bar.s{height:5px}
.bar.fav i{background:var(--gold)}
.bar.hb i{background:var(--cinnabar)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--paper2);border-radius:8px;padding:6px 4px;text-align:center;opacity:.95}
.stat b{display:block;font-size:15px;font-variant-numeric:tabular-nums;font-weight:600}
.stat small{font-size:11px;color:var(--ink2)}
.heart{display:flex;align-items:center;gap:8px;font-size:12px}
.heart .bar{flex:1}
.heart label{color:var(--cinnabar);font-family:var(--f-disp);font-size:14px}

/* section heads */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.sec-h h2{font-size:19px}
.sec-h span{font-size:12px;color:var(--ink2)}

/* disciples row */
.drow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dcard{border:1.5px solid;border-radius:12px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;position:relative;text-align:center}
.dcard.locked{opacity:.55}
.dcard.empty{border:1.5px dashed var(--line)!important;background:transparent;color:var(--ink2);justify-content:center;min-height:150px}
.av{width:42px;height:42px;border-radius:50%;background:var(--paper2);border:1px solid var(--ink2);display:grid;place-items:center;font-family:var(--f-disp);font-size:21px;flex:none}
.av.lg{width:58px;height:58px;font-size:28px}
.dn{font-family:var(--f-disp);font-size:16px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr{font-size:11px;color:var(--ink2)}
.mini{width:100%;display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ink2)}
.mini .bar{flex:1}
.tag{position:absolute;top:6px;right:6px;font-size:10px;padding:0 5px;border-radius:4px;background:var(--ink);color:var(--paper2)}
.tag.ok{background:var(--jade)}
.tag.warn{background:var(--cinnabar)}

/* action bar */
.actbar{display:flex;flex-direction:column;gap:8px}
.btn.big{font-family:var(--f-disp);font-size:20px;padding:13px;letter-spacing:.2em}
.minor{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.minor button{border:1px solid var(--line);background:var(--paper2);border-radius:8px;padding:9px 4px;font-size:14px;position:relative}
.dot{position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--cinnabar)}
.event{box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;border:1.5px solid var(--cinnabar);background:var(--paper2);border-radius:10px;padding:10px 12px;text-align:left;animation:pulse 2.4s ease-in-out infinite}
.event b{display:block;font-family:var(--f-disp);font-size:17px;font-weight:400;color:var(--cinnabar)}
.event small{font-size:12px;color:var(--ink2)}
.event>span:nth-child(2){flex:1}
.seal-s{width:30px;height:30px;background:var(--cinnabar);color:#fff;font-family:var(--f-disp);display:grid;place-items:center;border-radius:4px}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--cinnabar) 18%,transparent)}}

/* chronicle */
.chron ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.chron li{display:flex;gap:8px;border-bottom:1px dotted var(--line);padding-bottom:5px}
.chron time{color:var(--jade);flex:none;font-size:12px;min-width:52px;font-variant-numeric:tabular-nums}

/* modal sheet */
#modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:50;animation:fade .18s;padding:16px}
#modal.still,#modal.still .sheet{animation:none}
.sheet{background:var(--paper2);width:100%;max-width:460px;max-height:min(86vh,100%);display:flex;flex-direction:column;border-radius:18px;box-shadow:0 10px 36px var(--shadow);animation:rise .2s ease-out}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:21px}
.x{background:none;border:none;font-size:26px;line-height:1;color:var(--ink2);padding:0 4px}
.sheet-b{overflow-y:auto;padding:14px max(18px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet-f{display:flex;gap:8px;padding:10px 18px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.sheet-f .btn{flex:1;min-width:120px}
@keyframes rise{from{transform:scale(.96);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.hint{font-size:13px;color:var(--ink2)}
.prose p+p{margin-top:8px}
.prose{font-size:15px;line-height:1.85}
.big-c{font-family:var(--f-disp);font-size:30px;text-align:center;color:var(--cinnabar)}
.chip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:4px;color:#fff;margin:0 4px 4px 0;line-height:1.7}
.fate{display:inline-block;font-size:12px;padding:1px 7px;border-radius:4px;border:1px solid var(--gold);color:var(--gold);margin:0 4px 4px 0}
.gd{display:inline-block;font-size:11px;padding:0 5px;border-radius:3px;color:#fff;margin-right:5px;font-family:var(--f-disp)}
.gd.g0{background:var(--g0)}.gd.g1{background:var(--g1)}.gd.g2{background:var(--g2)}.gd.g3{background:var(--g3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;min-width:0}
.barrow{display:grid;grid-template-columns:40px 1fr 64px;align-items:center;gap:8px;font-size:12px}
.barrow span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.blk h4{font-family:var(--f-disp);font-weight:400;font-size:16px;margin:0 0 6px}
.fdesc{font-size:12px;color:var(--ink2);margin:-2px 0 6px}
.goals{display:flex;flex-wrap:wrap;gap:6px}
.goals button{border:1px solid var(--line);background:transparent;border-radius:20px;padding:4px 11px;font-size:13px}
.goals button.on{background:var(--jade);border-color:var(--jade);color:#fff}
.goals button:disabled{opacity:.5}
.dlog{list-style:none;padding:0;margin:0;font-size:12px;display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto}
.dlog li{border-bottom:1px dotted var(--line);padding-bottom:3px}
.dlog time{color:var(--jade);margin-right:6px}
.dhead{display:flex;gap:12px;align-items:center;border:1.5px solid;border-radius:12px;padding:12px}
.dhead .dn{font-size:22px;white-space:normal}
.dhead small{font-size:12px;color:var(--ink2);font-family:var(--f-body)}

/* talk */
.talk{display:flex;gap:10px;align-items:flex-start}
.bubble{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 14px;font-size:15px;line-height:1.8;min-height:64px;position:relative}
.bubble .who{display:block;font-family:var(--f-disp);color:var(--jade);font-size:14px;margin-bottom:2px}
.delta{font-size:12px;color:var(--ink2);text-align:center;min-height:18px}
.igrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.igrid button{border:1px solid var(--ink);background:transparent;border-radius:8px;padding:10px 2px;font-family:var(--f-disp);font-size:17px}
.igrid button.danger{border-color:var(--cinnabar);color:var(--cinnabar)}
.igrid button:disabled{opacity:.3}
.opts{display:flex;flex-direction:column;gap:8px}
.opts .btn{text-align:left}

/* items */
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.item .info{flex:1;min-width:0}
.item .nm{font-size:14px}
.item .ds{font-size:12px;color:var(--ink2)}
.item .ct{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink2)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:none;padding:6px 10px;font-family:var(--f-disp);font-size:16px;color:var(--ink2);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--cinnabar)}
.eqs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.eq{border:1px dashed var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:12px;min-height:54px;background:transparent}
.eq.on{border-style:solid;border-color:var(--gold);background:var(--paper)}

/* activities */
.acts{display:flex;flex-direction:column;gap:8px}
.act{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px}
.act b{font-family:var(--f-disp);font-weight:400;font-size:18px}
.act em{font-style:normal;font-size:12px;color:var(--jade);align-self:center;font-variant-numeric:tabular-nums}
.act p{grid-column:1/-1;font-size:12px;color:var(--ink2)}
.act:disabled{opacity:.4}
.act.special{border-color:var(--cinnabar)}

/* candidates */
.cands{display:flex;flex-direction:column;gap:8px}
.cand{border:1.5px solid;border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative}
.cand.sel{box-shadow:0 0 0 3px var(--cinnabar)}
.cand-h{display:flex;gap:10px;align-items:center}
.cand-h>div:nth-child(2){flex:1;min-width:0}
.cand-h b{font-family:var(--f-disp);font-weight:400;font-size:18px;display:block}
.cand-h small{font-size:12px;color:var(--ink2)}
.chk{font-size:12px;color:#fff;background:var(--cinnabar);border-radius:4px;padding:0 6px}
.chk:empty{display:none}
.imp{font-size:12px;color:var(--ink2);font-style:italic}
.cand .fdesc{margin:0}

/* title & setup */
.title-screen{min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
.vtitle{display:flex;gap:14px;align-items:flex-start;justify-content:center}
.vtitle h1{writing-mode:vertical-rl;font-size:54px;letter-spacing:.12em;line-height:1}
.vtitle .sub{writing-mode:vertical-rl;font-size:15px;color:var(--ink2);letter-spacing:.3em;margin-top:40px}
.bigseal{width:62px;height:62px;background:var(--cinnabar);color:#fff;font-family:var(--f-disp);font-size:20px;line-height:1.05;display:grid;place-items:center;border-radius:6px;transform:rotate(-6deg);margin-top:auto;box-shadow:inset 0 0 0 3px rgba(255,255,255,.3)}
.title-btns{display:flex;flex-direction:column;gap:10px;width:min(260px,100%)}
.tagline{font-size:13px;color:var(--ink2);max-width:30em}
.form{display:flex;flex-direction:column;gap:16px}
.field label.l{display:block;font-family:var(--f-disp);font-size:17px;margin-bottom:6px}
.field input[type=text],.field input[type=number],.field select{width:100%;box-sizing:border-box;font:inherit;padding:9px 12px;border:1px solid var(--ink2);border-radius:6px;background:var(--paper2);color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1.5px solid var(--line);border-radius:8px;padding:8px 2px;font-size:14px}
.seg button.on{box-shadow:0 0 0 2px var(--ink)}
.rootbox{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper2)}
.rootbox>div{flex:1;min-width:0}
.rootbox b{font-family:var(--f-disp);font-weight:400;font-size:18px;display:block}
.story{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;gap:22px}
.story .prose{font-size:17px}
.ending{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center}
.ending h1{font-size:44px;color:var(--cinnabar)}
.ending .prose{text-align:left}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper2);padding:8px 16px;border-radius:20px;font-size:13px;z-index:80;max-width:86%;text-align:center}
.roster-row{display:flex;align-items:center;gap:10px;border:1.5px solid;border-radius:10px;padding:8px 10px;text-align:left;width:100%}
.roster-row>div:nth-child(2){flex:1;min-width:0}
.roster-row b{font-family:var(--f-disp);font-weight:400;font-size:16px}
.roster-row small{display:block;font-size:12px;color:var(--ink2)}
.st-tag{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--ink2);color:var(--ink2);flex:none}
.mail{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper);font-size:13px}
.mail b{font-family:var(--f-disp);font-weight:400;font-size:15px}
.mail .att{color:var(--gold);font-size:12px;margin-top:4px}
.confirm-box{border:1px solid var(--cinnabar);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}

/* 洞天品阶：越修葺越华丽 */
.cavelv{font-family:var(--f-body);font-size:11px;color:var(--ink2);margin-left:8px;letter-spacing:.1em;vertical-align:middle}
body.cave-1 .pcard{border-style:double;border-width:4px}
body.cave-1 .cavelv{color:var(--jade)}
body.cave-2 .pcard{border-style:double;border-width:4px;box-shadow:0 0 0 1px var(--gold),0 8px 22px var(--shadow)}
body.cave-2 .cavelv,body.cave-2 .top .cave{color:var(--gold)}
body.cave-2 .seal{box-shadow:inset 0 0 0 2px var(--gold)}
body.cave-2 .btn.big{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
body.cave-3{background-image:radial-gradient(ellipse 120% 50% at 50% 0,var(--mist),transparent 70%),radial-gradient(circle at 15% 85%,color-mix(in srgb,var(--gold) 14%,transparent),transparent 40%),radial-gradient(circle at 90% 60%,color-mix(in srgb,var(--jade) 14%,transparent),transparent 40%)}
body.cave-3 .pcard{border:3px solid var(--gold)!important;box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 25%,transparent),0 10px 30px var(--shadow);position:relative;overflow:hidden}
body.cave-3 .pcard::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.25) 50%,transparent 60%);background-size:250% 100%;animation:shine 6s linear infinite;pointer-events:none}

body.cave-3 .btn.big{background:linear-gradient(90deg,var(--ink),color-mix(in srgb,var(--gold) 40%,var(--ink)),var(--ink));border-color:var(--gold)}
body.cave-3 .dcard{box-shadow:0 0 0 1px var(--gold)}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
input[type=range]{width:100%;accent-color:var(--jade)}
.cave-up{border:1px solid var(--line);background:var(--paper2);color:var(--jade);border-radius:50%;width:22px;height:22px;font-size:10px;line-height:1;margin-left:6px;vertical-align:middle;padding:0}
.cave-up:hover{border-color:var(--jade)}
.sick-chip{border:1.5px solid var(--cinnabar);color:var(--cinnabar);background:color-mix(in srgb,var(--cinnabar) 10%,transparent);border-radius:999px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;margin-right:6px;white-space:nowrap}

NEM_T.SJ.hate={chat:SP(`（按剑不动）{s}还有闲情寒暄？当年你废我经脉时，可没这般好兴致。|门规第一条，尊师重道。可惜你先把这四个字踩进了泥里。|你我已无师徒名分，不必再找话头，有话直说，说完便走。|（冷笑）天气？我只记得被逐出山门那日，雨下得很大。|我守了十年规矩，换来一纸除名。如今你倒想与我闲谈？|你问我近况如何？托你的福，活得比你想的硬。|礼数我还记得，所以我没拔剑。但我的耐心，只够你说三句话。|别用从前那种口气同我说话，你不配，我也不再是你的弟子。|当年戒堂之上你一言不发，今日倒是话多了。|我每日晨起仍会练那套剑法，只为有朝一日亲手还给你。|{s}——不，这称呼早该改了。阁下有何贵干？|闲话少说。宗门欠我的公道，你打算何时还？|你说山上的桃花又开了？与我何干，那地方我已不认。|（整了整衣襟）我仍按旧礼站着，不是敬你，是不想失了自己的体面。|你若是来叙旧的，便请回。旧事每一桩，我都记在账上。|规矩是你教的，背叛也是你教的。你还想教我什么？|我曾把你说的每个字奉为圭臬，如今一个字都不信了。|你看我做什么？看我落魄的样子，好回去向长老们交差？|寒暄是给外人的。你连外人都不如，你是仇人。|当年你若肯替我说一句话，我何至于此。现在开口，晚了。|我在山下立了新的规矩，第一条便是，不与你多言。|你倒是一点没变，连说话的腔调都和当年一样惹人厌。|（垂眸拭剑）说吧，我听着。听完了，我们再算账。|你说你一直惦记我？那除名簿上的朱批，是谁落的笔？|此地不是你的宗门，你的话在这里不算数。|我做事讲究有始有终。你我这笔账，迟早要清。|别站那么近。按礼，仇人之间至少隔三丈。|你还记得我的名字？真难得，我以为你早已划去了。|宗门的规矩我背得比谁都熟，可它护不住我，也护不住你。|你今日来，是想求和，还是想看我笑话？两样我都不给。`),care:SP(`收起你的关心。当年我跪在戒堂三天三夜，你可曾问过一句？|伤？这道疤是你亲手留的，如今来问疼不疼，可笑。|（避开）不劳{s}挂念，我自会照料自己，从前也没人照料我。|药我不收。谁知道里头掺了什么，你的东西我信不过。|你让我按时吃饭？我被逐出山门那夜，连口热汤都没有。|关怀弟子是师长本分，可我早已不是你的弟子，这份本分免了。|你这般惺惺作态，是怕我报复，还是怕良心不安？|我的伤好不好，与你无关。你只需记得，它们因你而来。|别碰我。规矩说得清楚，被逐之人与宗门再无瓜葛。|迟来的照拂比刀子还利，{s}可真会挑时候。|你若真有心，当年就不该签那道逐令。|（冷笑）嘘寒问暖？你教过我，虚礼最是无用。|我活得好好的，不必你操心。等我登门那日，你再操心不迟。|你问我冷不冷？比起戒堂的青石板，这点风算什么。|这些年我生病受伤从无人问津，早已习惯了，你不必破例。|你的关心若是真的，那我这些年的恨又算什么？我不准它是真的。|把药拿回去，我不欠你人情，也不打算欠。|我按时吃饭、按时练剑、按时恨你，一日不曾懈怠。|你现在对我好，是想让我收剑？做梦。|你记得我旧伤会在雨天发作？记得又如何，伤是你给的。|虚情假意。你若真心疼我，便把公道还我。|你从前说，关怀须有分寸。你如今越界了，{s}。|我不需要怜悯，尤其是来自你的怜悯。|你给我包扎，就不怕我趁机一剑刺过去？|少拿从前那套来哄我，我已经不是会为一句话高兴半天的孩子了。|（后退一步）站住。你的手，曾指着我说“逐出师门”。|你送来的东西我已经全扔了，下回不必再费心。|我好不好，你迟早会知道——在我剑指你的那天。|你这些年过得心安理得，现在来关心我，是想求个心安？|担心我？还是担心我把宗门的丑事抖出去？`),scold:SP(`（拍案而起）你也配说教？当年违背门规的究竟是谁！|骂吧，反正你最擅长的就是给人定罪。|你骂我不孝不忠？我守礼守了半辈子，换来的是什么！|好，好得很。这一句，我记下了，连同从前那些一并清算。|你再说一遍，我的剑可不认得什么尊卑。|（冷笑）恼羞成怒了？{s}也有词穷的时候。|你骂得越狠，越显得你心虚。|我早已不是任你训斥的弟子，再多说一字，休怪我无礼。|当年在戒堂你也是这般语气，可惜我已不会再跪了。|叛徒？是宗门先背弃了我，我不过是走了你们逼我走的路。|你辱我无妨，辱我所守之道，我必让你付出代价。|原来在你心中，我始终是个不成器的东西。多谢点醒。|骂完了？那该轮到我了，{s}，我等这天很久了。|你没资格以师尊之名训我，那名分是你亲手撕碎的。|我咽下的委屈比你骂的话多得多，你这几句算什么。|有本事便按门规处置我，看看如今谁的规矩管用。|（握紧剑柄）我再忍你一次，只因礼数尚在，下回不会了。|你从前骂我愚钝，我便日夜苦练。如今你骂我，我只想拔剑。|尊卑有序？你先告诉我，你配得上那个“尊”字么？|你骂的每一句，我都会刻在剑上，一笔一笔还给你。|真是讽刺 <script>

const $=s=>document.querySelector(s);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DIM=[31,28,31,30,31,30,31,31,30,31,30,31];
const TA=d=>!d?'他':d.gender==='m'?'他':d.gender==='f'?'她':'TA';
const SAVE_KEY='wqd_save_v2',CODEX_KEY='wqd_codex_v1';
let G=null;
const CNUM=['零','大','二','三','四','五','六','七','八','九','十'];
function ordCn(n){if(n<=10)return CNUM[n];if(n<20)return '十'+(n===11?'一':CNUM[n-10]);return n+''}
const isElder=d=>d.gender==='m'||d.gender==='inter';
function seniorTitle(d){return ordCn(d.seq)+(isElder(d)?'师兄':'师姐')}
const isKin=(a,b)=>a.parent===b.id||b.parent===a.id;
function sibTitle(sp,sb){if(!sp||!sb)return '同门';if(sb.id===sp.parent)return sp.dRole;if(sp.id===sb.parent)return '孩子';if(sb.seq<sp.seq)return seniorTitle(sb);return ordCn(sb.seq)+(isElder(sb)?'师弟':'师妹')}
function fmt(s,d,sib){return String(s).replace(/\{s\}/g,'师尊').replace(/\{d\}/g,d?d.name:'').replace(/\{ta\}/g,TA(d)).replace(/\{ta2\}/g,TA(sib)).replace(/\{sib\}/g,sib?sibTitle(d,sib):'同门').replace(/\{n\}/g,G?G.p.name:'')}
const sibName=(d,sib)=>isKin(d,sib)?sibTitle(d,sib)+'-'+(sib.given||sib.name):sibTitle(d,sib)+(sib.given||sib.name);

const dn=t=>t.y*400+t.m*32+t.d;
const dateStr=(t=G.date)=>`仙历${t.y}年${t.m}月${t.d}日`;
const short=(t=G.date)=>`${t.m}月${t.d}日`;
function addDays(t,n){const o={...t};for(let i=0;i<n;i++){o.d++;if(o.d>DIM[o.m-1]){o.d=1;o.m++;if(o.m>12){o.m=1;o.y++}}}return o}
function toast(s){const t=$('#toast');t.textContent=s;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400)}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G))}catch(e){}}

    else if(a==='思慕'){addLove(d,.2);d.mood+=1}else if(a==='静坐'){d.demon-=.6;d.mood+=1}

function setGoal(id,g){const d=getD(id);const mk=G.date.y*12+G.date.m;if(d.goalMonth===mk&&d.goal!==g)return toast('本月已定过目标，下月再改吧');d.goal=g;d.goalMonth=mk;

  clampD(d);logD(d,`师尊定下本月目标：${GOALS[g].n}。`);save();openD(id);if(r)toast(r)}
function tryGraduate(id){const d=getD(id);if(d.realm<20)return;if(d.age>=18&&d.love>=55&&chance(Math.min(.9,d.love/100))){hideModal();G.queue.unshift({k:'clingy',id});nextEvent();return}hideModal();graduate(d);nextEvent()}
function pickCareer(d){const pref=CAREER_PREF[MB[d.mbti].g];return chance(.6)?pick(pref):ri(0,CAREERS.length-1)}
function graduate(d){d.status='grad';d.career=pickCareer(d);d.endDate=dateStr();d.lastContact=dn(G.date);G.stats.grads++;const gain=30+(d.realm-20)*3;G.p.kpi+=gain;logD(d,`出师，去做了${CAREERS[d.career].n}。`);log(`${d.name}出师了！KPI +${gain}。`);
  G.queue.unshift({k:'msg',title:'出师',html:`<div class="prose"><p>${d.name}向你行了三拜九叩的大礼。</p><p>“弟子此去，${pick(['山高水远','天涯海角','不知归期'])}。师尊保重。”</p><p>${TA(d)}打算去做——<b>${CAREERS[d.career].n}</b>。</p></div><p class="hint">宗门KPI +${gain}。${TA(d)}永远是门中的${seniorTitle(d)}，会在师门表里继续书写自己的故事，偶尔来信、回来看你。</p>`})}
function expel(id,ok){const d=getD(id);if(!ok){modal({title:'逐出师门',html:`<div class="confirm-box"><p>确定将 <b>${d.name}</b> 逐出师门吗？此举无法挽回，宗门KPI -5，${TA(d)}也未必会善罢甘休。</p></div>`,btns:[{t:'再想想',fn:()=>openD(id)},{t:'逐出',cls:'redf',fn:()=>expel(id,true)}]});return}
  doExpel(d);hideModal();G.queue.unshift({k:'msg',title:'逐出师门',html:`<p class="prose">${d.name}背着行囊下了山，始终没有回头。</p>`});nextEvent()}
function doExpel(d){d.demon=clamp(d.demon+30,0,100);G.p.kpi-=5;d.endDate=dateStr();d.status=(d.love>=60||d.demon>=60)?'nemesis':'expelled';logD(d,'被逐出师门。');log(`将${d.name}逐出师门。`)}
function rebornCand(old){const c=genDisciple();if(chance(.7))c.gender=old.gender;c.age=14;c.fates=['zs',...old.fates.filter(f=>f!=='zs').slice(0,2)];c.love=Math.round(old.love*.6);c.past=old.id;c.favor=50;return c}

// ================= 拍卖 =================
function genLots(){const pool=[{k:randFaqi(3),b:3000},{k:'p:xs:3',b:1500},{k:'p:pj:3',b:1200},{k:'p:jq:3',b:900},{k:'p:yh:0',b:250,n:3},{k:randFaqi(2),b:900},{k:'p:wq:3',b:1000},{k:'p:jx:3',b:800},{k:randFaqi(3),b:3200},{k:'f:ssj',b:1500},{k:'p:hy:3',b:500}];return pool.sort(()=>R()-.5).slice(0,4).map(l=>({...l,n:l.n||1,price:l.b,val:Math.round(l.b*(1.05+R()*.35)),lead:null,sold:false}))}
const NPC_BIDDERS=['天剑宗长老','一位蒙面修士','万宝楼掌柜','魔道散修','南疆巫女','某位富家公子','青云书院院长','一个笑眯眯的老头'];

// ================= 结局 =================
const ENDINGS={
  heart:{t:'动心即死',s:d=>`那一刻，你听见了道心碎裂的声音。<br><br>无情道修士，动情即是死劫。${d?`你最后看到的，是${d.name}惊慌失措的脸。`:''}<br><br>玄天宗的史书上，留下了一行小字：「${G.p.name}，${RANKS[Math.max(0,G.p.rank)]}，坐化于${G.cave}，年${G.p.age}。」<br>据说，${d?d.name+'在你墓前守了很多年':'你的洞府后来空置了很多年'}。`},
  love:{t:'有情道',s:d=>`你散尽了一身修为。<br><br>${REALMS[G.p.realm]}的灵力如潮水般退去，只剩下一具会老、会病的凡人之躯。可${d.name}握着你的手，一次也没有松开。<br><br>从此世间少了一位玄天宗长老，多了一对寻常眷侣。宗门KPI考核表上，你的名字被划掉了。<br>你不在乎。`},
  forced:{t:'金屋',s:d=>`你没能逃出去。<br><br>此后百年，玄天宗再无人见过${G.p.name}。<br>有传言说，某座无名仙岛终年禁制环绕，岛上的人从不出来。偶尔有渔人远远望见，一个身影在岸边静静坐着，另一个身影${d.status==='demon'?'披着玄黑魔袍':'穿着当年玄天宗的弟子服'}，寸步不离地守在旁边。<br><br>——师尊，是一个高危职业。`},
  killed:{t:'青出于蓝',s:d=>`${d.name}的剑，比你想象中更快。<br><br>倒下时，你想起很多年前收徒大会上，那个${MB[d.mbti].imp}的孩子。<br>你终究没能逃过“师尊”这个职业的宿命。`},
  expelled:{t:'卷铺盖走人',s:()=>`年终考核，你的教学KPI惨不忍睹，已经降无可降。<br><br>长老会一致决议：收回${G.cave}，请你另谋高就。<br>你背着乾坤囊下了山。听说后来，你在山脚开了个茶摊，生意还不错。至少，再也没有徒弟会爱上你了。`},
  birth:{t:'难产',s:()=>`孩子的啼哭声响起时，你的灵力已经散尽了。<br><br>无情道修士，动情是劫，生子更是劫。你最后看了一眼那个皱巴巴的小婴儿，闭上了眼睛。<br><br>玄天宗把这件事压了下去。史书上只写了一句：「${G.p.name}，闭关时走火入魔，坐化。」`},
  realmdie:{t:'殒身秘境',s:()=>`秘境深处，你终究没能走出来。<br><br>宗门的魂灯熄灭那天，${G.cave}的弟子们在山门外跪了一夜。<br>后来有人在秘境入口立了一块碑，上面刻着你的道号。`},
  ascend:{t:'白日飞升',s:()=>`九重天劫散去，金光自云端垂落。<br><br>你踏着天梯，一步步走向仙界。身后，${G.ds.filter(d=>d.status==='grad').length}位出师的弟子遥遥跪拜。<br><br>你成为了玄天宗万年来第一位飞升的无情道修士——也是第一个全身而退的师尊。`}
};
function setEnding(k,d){G.sr=null;G.feast=null;G.over={k,id:d?d.id:null,date:dateStr()};if(!CODEX.endings.includes(k)){CODEX.endings.push(k);saveCodex()}unlock(k);hideModal();save();render()}
</script>
<script>
// ================= 事件 =================
function nextEvent(){if(!G)return;if(G.over){render();return}if(!$('#modal').hidden)return;const ev=G.queue.shift();if(!ev){save();return}const h=EV[ev.k];if(!h){nextEvent();return}h(ev)}
function result(text,d,sib){modal({title:'……',x:false,html:`<p class="prose">${fmt(text,d,sib)}</p>`,btns:[{t:'继续',cls:'pri',fn:closeModal}]})}
function opt(t,fn,dis,cls){return{t,fn,dis,cls}}
function evModal(title,html,os){modal({title,x:false,html,btns:os.map(o=>({t:o.t,cls:o.cls||'',dis:o.dis,fn:o.fn}))})}
function darkFail(d){if(dPower(d)>=pPower()*.85){setEnding('forced',d);return}addHeart(45,d);result('你拼尽全力才稳住灵台，将{d}震开。道心受到重创。',d)}
function checkReborn(d){if(d.love>=60&&d.memory>=100&&!d.rebornSched){d.rebornSched=true;G.reborn=G.reborn||[];G.reborn.push({id:d.id,due:dn(addDays(G.date,ri(200,700)))});return '<br><br>恍惚间，你好像听见有人在很远的地方，轻轻唤了一声“师尊”。'}return ''}
function doInvite(d,inv,all){hideModal();const from=startTurn();for(let i=0;i<inv.days;i++){simDay();if(G.over)return}G.stats.days+=inv.days;const e=inv.e,k=all?.5:1;
  if(e.x)addDXP(d,needXP(d.realm)*e.x/100);d.favor+=(e.f||0);d.mood+=(e.m||0);if(e.l)addLove(d,e.l*k);rawCrush(d,all?20:30);if(e.j)G.p.jade=Math.max(0,G.p.jade+e.j);
  let extra='';if(e.pill){const pk=randPill(rollGrade(G.p.realm));addItem(G.bag,pk);extra=`（得到${itemInfo(pk).name}）`}
  let gtxt='';if(all)gtxt=groupOuting(d);else jealousy(d,2);
  clampD(d);logD(d,`和师尊${inv.n}，开心了好几天。`);log(`应${d.name}之邀${inv.n}${inv.days}日。`);
  G.queue.unshift({k:'msg',title:inv.n,html:`<p class="prose">${fmt(inv.r,d)}${gtxt}${extra}</p>`});endTurn(from)}
function rebornIntro(c,old){return `一个十四岁的孩子跪在洞府外。看见你的那一刻，${TA(c)}脱口而出：“师尊……”随即自己也愣住了。<br>你恍惚觉得，${TA(c)}的眉眼，有几分像当年的${old?old.name:'某个故人'}。`}
const EV={
  msg:e=>modal({title:e.title,html:e.html,btns:[{t:'知道了',cls:'pri',fn:closeModal}]}),
  shop:()=>openShop(),
  end:e=>setEnding(e.e),
  mail:e=>modal({title:'飞鹤传书',html:`<p class="prose">出师的弟子们寄来了 ${e.n} 封信。</p>${G.mail.slice(0,e.n).map(mailHtml).join('')}`,btns:[{t:'收下',cls:'pri',fn:()=>{G.mailBadge=false;closeModal()}}]}),
  heart:()=>{const alive=aliveDs().filter(d=>d.crush>0).sort((a,b)=>b.crush-a.crush);const top=alive[0];const mate=top&&top.age>=18&&top.love>=80&&top.favor>=80&&top.demon<40?top:null;
    if(mate)evModal('道心将碎',`<p class="prose">你听见了道心裂开的声音。<br>灵台崩塌之际，有人握住了你的手——是${mate.name}。<br>“师尊，跟我走吧。”</p>`,[opt('放下无情道，握紧那只手',()=>setEnding('love',mate)),opt('宁死守道',()=>setEnding('heart',mate))]);
    else setEnding('heart',top)},
  hint:e=>{const d=getD(e.id);if(!d||d.status!=='home')return nextEvent();evModal('心思',`<p class="prose">${fmt(pick(HINTS),d)}</p>`,[
    opt('装作没看见',()=>{addLove(d,-1);result('你若无其事地移开了视线。',d)}),
    opt('不轻不重地敲打一句',()=>{addLove(d,-4);const t=MB[d.mbti].refuse;if(t==='more'){addLove(d,3);result('……{d}反而笑了。',d)}else if(t==='hurt'){d.demon+=3;clampD(d);result('{d}的眼神黯了黯。',d)}else result('{d}低下头，应了一声。',d)}),
    opt('回以一笑',()=>{addLove(d,5);addHeart(6,d);d.favor+=3;clampD(d);result('{d}愣住了，随即整个人都亮了起来。你的道心，微微一颤。',d)})])},
  harass:e=>{const d=getD(e.id);if(!d||d.status!=='home')return nextEvent();evModal('不对劲',`<p class="prose">${fmt(pick(HARASS[MB[d.mbti].g]),d)}</p>`,[
    opt('严词拒绝',()=>result(refuse(d,'strict'),d)),
    opt('装傻充愣',()=>result(refuse(d,'dumb'),d)),
    opt('派去外门历练一月',()=>{d.away=30;addLove(d,-10);d.mood-=15;d.favor-=5;if(fx(d).yandere)d.demon+=10;clampD(d);logD(d,'被师尊外派历练。');result('你给{d}派了一趟远差。临行前，{ta}回头望了你很久。',d)}),
    opt('温柔回应',()=>{addLove(d,12);addHeart(12,d);d.favor+=5;clampD(d);result('{d}眼中满是不可置信的欢喜。……你的道心，裂开了一道细纹。',d)},false,'red')])},
  visit:e=>{const d=getD(e.id);if(!d||d.status!=='grad')return nextEvent();d.lastContact=dn(G.date);evModal('旧徒来访',`<p class="prose">已出师的${d.name}（${seniorTitle(d)}）回来看你了。${TA(d)}说是“路过”，却带了满满一车礼物。</p><p class="prose">${fmt(pick(HARASS[MB[d.mbti].g]),d)}</p>`,[
    opt('留{ta}吃顿饭'.replace('{ta}',TA(d)),()=>{d.favor+=5;addLove(d,3);addHeart(3,d);d.demon-=5;clampD(d);logD(d,'回师门看望师尊，留下吃了顿饭。');result('你们吃了一顿饭，聊起很多旧事。{d}走的时候，一步三回头。',d)}),
    opt('客客气气送走',()=>{d.favor+=1;addLove(d,-5);clampD(d);result('{d}笑了笑：“师尊还是老样子。”临走前把礼物都留下了。',d)}),
    opt('闭门不见',()=>result(refuse(d,'strict')+'<br>（{d}在门外站了很久才走。）',d)),
    opt('温柔回应',()=>{addLove(d,10);addHeart(10,d);clampD(d);result('{d}怔住了，眼眶一点点红了。“弟子……下个月还来。”',d)},false,'red')])},
  confess:e=>{const d=getD(e.id);if(!d||!['home','grad'].includes(d.status))return nextEvent();d.cd=dn(addDays(G.date,30));const jx=bestPill(G.bag,'jx');const pre=d.status==='grad'?`已出师的${d.name}忽然回到了洞府。<br>`:'';evModal('告白',`<p class="prose">${pre}${fmt(CONFESS_T[d.mbti]&&chance(.8)?pick(CONFESS_T[d.mbti]):CONFESS[MB[d.mbti].g],d)}</p>`,[
    opt('接受（无情道修士，动心即死）',()=>setEnding('love',d),false,'redf'),
    opt('严词拒绝',()=>{const s=refuse(d,'strict');addLove(d,-5);result(s,d)}),
    opt('以师徒伦常婉拒',()=>result(refuse(d,'ethic'),d)),
    opt(jx?`先服下${itemInfo(jx).name}再作答`:'（乾坤囊里没有静心丹）',()=>{removeItem(G.bag,jx);addHeart(-20);addLove(d,-10);d.demon+=5;clampD(d);G.stats.refused=(G.stats.refused||0)+1;result('丹药入喉，心湖重归平静。你淡淡道：“为师修的是无情道。”{d}怔怔看着你，眼中的光一点点熄灭了。',d)},!jx),
    ...(d.status==='home'?[opt('将其逐出师门',()=>{doExpel(d);result('“滚。”你只说了一个字。{d}跪了很久，最终还是走了。',d)})]:[])])},
  dark:e=>{const d=getD(e.id);if(!d||!['home','grad','nemesis','demon'].includes(d.status))return nextEvent();const k=e.kind||pick(['drug','bed','cage']);const pp=pPower(),dp=dPower(d),calm=pFx().calm||0;const prefix=d.status==='grad'?`已出师多年的${d.name}，忽然回来了。<br>`:['nemesis','demon'].includes(d.status)?`叛出师门的${d.name}，不知何时潜回了${G.cave}。<br>`:'';
    if(k==='drug'){const jx=!!bestPill(G.bag,'jx');evModal('茶',`<p class="prose">${prefix}${d.name}亲手奉上一盏灵茶。你接过时，察觉茶香里混着一丝古怪的甜腻……<br>${d.name}垂着眼，嘴角含笑。</p>`,[
      opt('当场揭穿',()=>{if(chance(clamp(.35+calm+(jx?.2:0)+(G.p.realm-d.realm)*.02,.1,.95))){d.demon-=15;d.favor-=10;addLove(d,-5);clampD(d);result('你将茶盏重重搁下，茶水泼了一地。{d}的笑容僵在脸上，扑通跪下，浑身发抖。',d)}else darkFail(d)}),
      opt('假装饮下，暗中运功逼出',()=>{if(chance(powCheck(pp,dp))){d.demon-=8;clampD(d);result('药力被你逼出指尖。你若无其事地放下茶盏：“好茶。”{d}的脸色变得很难看。',d)}else darkFail(d)}),
      opt('一饮而尽（这是信任）',()=>{if(d.favor>=70&&d.demon<80){d.demon-=10;addLove(d,5);addHeart(8,d);clampD(d);result('……什么事也没发生。原来只是加了蜜的安神茶。{d}看着你毫不犹豫喝下的样子，眼眶忽然红了。',d)}else darkFail(d)},false,'red')])}
    else if(k==='bed'){evModal('夜半',`<p class="prose">${prefix}夜半，你察觉有人轻轻掀开了床帐。熟悉的气息靠近——是${d.name}。</p>`,[
      opt('一掌拍飞',()=>{if(chance(powCheck(pp,dp))){hurtD(d,40);d.demon+=10;addLove(d,-5);d.favor-=10;clampD(d);result('{d}撞穿了屏风，在地上蜷了很久才爬起来，一言不发地走了。',d)}else darkFail(d)}),
      opt('闭目默念清心咒',()=>{if(chance(clamp(.4+calm,.1,.95))){addHeart(10,d);d.demon-=5;clampD(d);result('{d}在床边坐了很久，最终只是替你掖好被角，悄然离去。',d)}else{addHeart(40,d);result('清心咒念到第三遍就乱了。你几乎是落荒而逃，道心剧震。',d)}}),
      opt('起身点灯，严肃谈话',()=>{if(d.favor>=50){d.demon-=20;addLove(d,-5);clampD(d);result('烛火亮起，{d}像是从梦里惊醒，跪在地上泣不成声。你们谈了一整夜。',d)}else{d.demon+=10;d.favor-=5;clampD(d);result('{d}冷笑一声，夺门而出。',d)}}),
      opt('……没有推开',()=>acceptBed(d),false,'red')])}
    else{evModal('锁灵阵',`<p class="prose">${prefix}你醒来时，发现自己被困在一座锁灵阵中，周身灵力凝滞。<br>${d.name}坐在阵外，温柔地看着你：“师尊，以后就留在这里，好不好？”</p>`,[
      opt('强行破阵',()=>{if(chance(powCheck(pp,dp*1.1))){d.demon-=5;hurtD(d,20);d.favor-=15;clampD(d);result('阵法在你的剑气下寸寸崩裂。{d}被反噬震伤，跌坐在碎石里，却还在笑。',d)}else setEnding('forced',d)}),
      opt('虚与委蛇，伺机脱身',()=>{if(chance(clamp(.35+(pFx().luck||0)+calm*.5,.1,.9))){d.demon-=10;clampD(d);result('你陪{d}演了三天的戏，终于寻到破绽脱身。{d}追出来时，你已在千里之外。',d)}else setEnding('forced',d)}),
      opt('以师徒情分相劝',()=>{if(d.favor>=60&&d.demon<85){d.demon-=25;clampD(d);result('“你还记得刚入门那年，为师教你写的第一个字吗？”{d}愣住了，泪水一滴滴落下，亲手撤去了阵法。',d)}else setEnding('forced',d)})])}},
  betray:e=>{const d=getD(e.id);if(!d||d.status!=='home')return nextEvent();d.status='nemesis';d.endDate=dateStr();G.p.kpi-=25;logD(d,'叛出师门。');log(`${d.name}叛出师门！KPI -25。`);unlock('betray');
    modal({title:'叛出师门',html:`<p class="prose">${d.name}留下一封信，连夜叛出了师门。<br>信上只有一句：“今日之辱，来日必报。”</p><p class="hint">宗门KPI -25</p>`,btns:[{t:'……',cls:'pri',fn:closeModal}]})},

<script>
// ================= 扩展：洞天、乾坤囊、孕育、在外弟子、秘境 =================

const RISKY=[0,6,12,15,17];
const BABY_NOTES=SP(`在摇篮里咿咿呀呀，冲每个路过的人笑|抓住了同门的手指，怎么也不松开|第一次翻身，把自己吓哭了|啃了半天灵果，糊得满脸都是|被灵兽园的小狐狸舔了一脸，咯咯直笑|学会了爬，一路爬到了师尊的蒲团上|第一次开口，含含糊糊喊了一声“师……”|午睡时攥着一片桃花瓣不放|摇摇晃晃地走了三步，扑进同门怀里|把师尊的拂尘当成了玩具|夜里哭闹，同门轮流抱着哄|盯着天上的灵鹤看了一下午`);
const EXILE_LINES={
 expelled:SP(`{d}在一座小城落了脚，靠给人看风水度日。|{d}在山下徘徊了很久，远远望着玄天宗的山门。|{d}加入了一伙散修，四处寻找机缘。|{d}在一座破庙里独自修炼，形容憔悴。|{d}在酒馆喝得烂醉，嘴里念叨着师尊的名字。|{d}替一座村子赶走了妖兽，村民管{ta}叫“仙人”。`),
 nemesis:SP(`{d}在南疆结识了一群邪修，修为突飞猛进。|{d}在暗处打听师尊的近况。|{d}独自闯过一处险地，身上又添了几道伤疤。|据说{d}投靠了与玄天宗不和的宗门。|{d}在悬崖边练剑，每一剑都像是冲着某个人去的。|{d}托人带话：“替我问候师尊。”语气说不出的古怪。`),
 demon:SP(`魔域传来消息，{d}又吞并了一个魔宗。|{d}的魔名已经传到了中州，小孩夜啼都拿{ta}的名字吓唬。|魔域边境有人看见{d}独自站在玄天宗的方向，站了很久。|{d}在魔域建起了一座宫殿，殿里挂着一幅画像，据说画的是{ta}的师尊。|{d}屠了一座正道山门，唯独放过了一个姓氏和师尊相同的孩子。|{d}的魔功又精进了一层。`)
};
function pInjured(){if(G.preg&&G.preg.carrier==='p'&&chance(.3))miscarry()}
function dropRealm(o){if(o.realm>0&&!BREAK[o.realm-1])o.realm--;o.xp=0}

function endEvent(e){autoFest(e);G.events=G.events.filter(x=>x!==e)}

function srLoot(mult){const S_=SRS();const out=[];const g=clamp(Math.floor((S_.diff-10)/10)+(chance(.3)?1:0),0,3);if(chance(.85*mult)){const kind=pick(S_.loot);const k=PILLS[kind].only!=null?`p:${kind}:${PILLS[kind].only}`:`p:${kind}:${g}`;addItem(G.bag,k);out.push(itemInfo(k).name)}

function srResolve(type){const S_=SRS(),team=srTeam();const tp=pPower()+team.reduce((s,d)=>s+dPower(d)*.5,0);const danger=basePow(S_.diff+G.sr.floor*1.6)*(.9+R()*.35)*(G.sr.floor===S_.floors-1?1.4:1);const ratio=danger/tp;const calm=pFx().calm||0;let ok=false,mult=1,txt='',dmg=1;

  else if(type==='blood'){ok=true;hurtP(15);if(G.over)return;team.forEach(d=>{d.demon+=8;clampD(d)});txt='血阵开启了。同行弟子的眼神有些发红。'}

<script>
// ================= 气血 =================
const hpMax=o=>Math.round((100+20*o.realm)*(1+((o===G.p?pFx().hp:faqiFx(dFaqi(o)).hp)||0)+(o.hpb||0)+(o.fates?(fx(o).hpm||0):0))+(o.hpf||0));
function hpOf(o){if(o.hp==null||isNaN(o.hp))o.hp=hpMax(o);return o.hp}
const hpPct=o=>hpOf(o)/Math.max(1,hpMax(o));
const injD=o=>hpPct(o)<.3, sevD=o=>hpPct(o)<.1;
const hpWord=o=>o.sick?'生病':sevD(o)?'重伤':injD(o)?'受伤':'';
function hurtD(d,pct){if(!d||d.status==='dead')return;d.hp=hpOf(d)-hpMax(d)*pct/100;if(d.hp<=0){if(d.revive){d.revive=false;d.hp=hpMax(d)*.3;logD(d,'命悬一线，返生丹救回了一条命。');return}d.hp=0;killD(d,'伤重不治，身死道消。');G.queue.push({k:'msg',title:'噩耗',html:`<p class="prose">${d.name}伤势过重，没能撑过去。</p>`})}}
function healD(d,pct){d.hp=Math.min(hpMax(d),hpOf(d)+hpMax(d)*pct/100)}
function hurtP(pct,killer){if(G.over)return;G.p.hp=hpOf(G.p)-hpMax(G.p)*pct/100;if(pct>=8)pInjured();if(G.p.hp<=0){if(G.p.revive){G.p.revive=false;G.p.hp=hpMax(G.p)*.3;log('命悬一线之际，返生丹护住了心脉。');return}G.p.hp=0;if(killer)setEnding(killer.love>=50&&killer.age>=18?'ice':'killed',killer);else setEnding(G.sr?'realmdie':'hpdie')}}
function healP(pct){G.p.hp=Math.min(hpMax(G.p),hpOf(G.p)+hpMax(G.p)*pct/100)}
function regen(o,boost=1){const p=hpPct(o);const r=p<.1?.005:p<.3?.01:.03;o.hp=Math.min(hpMax(o),hpOf(o)+hpMax(o)*r*boost)}
function dDaily(d){autoMed(d);if(d.sick&&G.date.d===1){d.sickM=(d.sickM||0)+1;if(chance(.3+.1*Math.min(3,d.sickM-1))){d.sick=false;d.tend=0;d.sickM=0;sickNote(d,'heal')}else{d.hp=hpOf(d)-hpMax(d)*.25;if(d.hp<=0){d.hp=0;killD(d,'久病不愈。');G.queue.push({k:'msg',title:'噩耗',html:`<p class="prose">${d.name}病了太久，终究没能熬过去。</p>`});return false}d.notes.push('病还没好，又虚弱了几分')}}if(!d.sick)regen(d);
  if(!d.sick&&d.realm<11&&chance(.0015)){d.sick=true;d.sickM=0;d.tend=0;sickNote(d,'sick')}return true}

let EXT={team:[],mode:'play',days:10};
function openExplore(){const ds=presentDs().filter(d=>!(d.child&&d.age<6)&&!injD(d)&&!d.sick);EXT.team=EXT.team.filter(id=>ds.some(d=>d.id===id));const d=clamp(EXT.days,3,300);const miss=missedFest(d);const play=EXT.mode==='play';
  modal({title:'下山游历',html:`<div class="blk"><h4>此行</h4><div class="goals"><button class="${play?'on':''}" onclick="EXT.mode='play';openExplore()">游山玩水</button><button class="${!play?'on':''}" onclick="EXT.mode='adv';openExplore()">历练探险</button></div><p class="fdesc" style="margin-top:6px">${play?'以游玩为主：放松身心、养伤、平复动心、增进师徒感情，偶有奇遇。':'以历练为主：机缘更多，凶险也更多。同行弟子会一起战斗、一起受伤。'}</p></div>
   <div class="blk"><h4>天数</h4><div class="goals">${[3,10,30,100,300].map(n=>`<button class="${d===n?'on':''}" onclick="EXT.days=${n};openExplore()">${n}天</button>`).join('')}</div><div class="field" style="margin-top:6px"><input type="number" id="days-in" min="3" max="300" value="${d}" aria-label="天数" onchange="EXT.days=clamp(parseInt(this.value)||3,3,300);openExplore()"></div></div>

function extPick(id){if(EXT.team.includes(id))EXT.team=EXT.team.filter(x=>x!==id);else if(EXT.team.length<3)EXT.team.push(id);else return toast('最多带三人');openExplore()}
const FUN_TXT=SP(`{t}在溪边钓了一下午鱼，钓上来的全被{t}放生了。|你们在山顶看了一场日出，{t}说这辈子都忘不了。|路过一个凡间小镇，{t}拉着你吃遍了一条街的小吃。|在一处温泉泡了半日，身上的旧伤都松快了。|{t}在花海里追蝴蝶，你在树下看着，难得地笑了。|你们在古寺借宿，听老僧讲了一夜因果。|赶上凡间庙会，{t}套圈套中了一只泥娃娃，硬塞给了你。|你们在湖上泛舟，{t}靠在船舷上睡着了。|夜里露宿山野，{t}指着星星给你讲故事。|在竹林里遇到一场细雨，你们躲在一块大石头下，听了很久的雨声。|{t}在集市上给你挑了一支发簪，红着脸说是顺手买的。|你们在瀑布下练剑，{t}被水冲得东倒西歪。`);

function exploreRun(days,o){const team=(o.team||[]).map(getD).filter(d=>d&&d.status==='home');const play=o.mode==='play';const r=G.p.realm,luck=pFx().luck||0;const n=Math.max(1,Math.floor(days/(play?6:12)))+(days>=30?1:0);
  const names=team.length?team.map(d=>d.name).join('、'):'你';const tp=pPower()+team.reduce((s,d)=>s+dPower(d)*.5,0);const lines=[];let cands=0;const grads=G.ds.filter(d=>d.status==='grad');const foes=['魔修','妖狼王','劫修','千年树妖','血煞宗弟子','化形蛇妖','尸傀','山贼头子','邪道散修'];
  for(let i=0;i<n&&!G.over;i++){const W=play?{fun:40,calm:20,jade:6,herb:10,fight:4,faqi:2,ruin:3,cand:freeSlots()-cands>0?4:0,meet:grads.length?4:0,trouble:3}:{fun:6,calm:8,jade:22,herb:20,fight:24,faqi:6+luck*40,ruin:7+luck*20,cand:freeSlots()-cands>0?8:0,meet:grads.length?5:0,trouble:6};
    const ev=wpick(Object.keys(W),k=>W[k]);
    if(ev==='fun'){const tt=team.length?pick(team).name:'你';let ft;for(let q=0;q<8;q++){ft=pick(FUN_TXT).replace(/\{t\}/g,tt);if(!lines.includes(ft))break}lines.push(ft);team.forEach(d=>{d.mood+=8;d.favor+=3;if(d.age>=18&&!d.child&&d.love>=30){addLove(d,2);addHeart(1,d)}if(d.child)addHeart(1,d);clampD(d)});calmHeart(1);healP(5)}
    else if(ev==='calm'){calmHeart(2);healP(8);lines.push(pick(EXP_TXT.calm))}
    else if(ev==='jade'){const j=Math.round(ri(18,66)*(1+r/20));G.p.jade+=j;lines.push(pick(EXP_TXT.jade).replace('{v}',j))}
    else if(ev==='herb'){const k=randPill(rollGrade(r,luck));addItem(G.bag,k);lines.push(pick(EXP_TXT.herb).replace('{v}',itemInfo(k).name))}
    else if(ev==='fight'){const foe=pick(foes);const e=basePow(r+ri(-3,3));if(chance(powCheck(tp,e))){const j=Math.round(ri(36,108)*(1+r/20));G.p.jade+=j;let s=pick(EXP_TXT.win).replace('{foe}',foe).replace('{v}',j);if(chance(.25)){const k=randFaqi(rollGrade(r,luck));addItem(G.bag,k);s+=`，以及${itemInfo(k).name}`}lines.push((team.length?`${names}与你并肩作战。`:'')+s+'。');hurtP(ri(0,8));team.forEach(d=>{addDXP(d,needXP(d.realm)*.06);d.favor+=2;clampD(d)})}
      else{lines.push(pick(EXP_TXT.lose).replace('{foe}',foe));hurtP(ri(15,35));team.forEach(d=>{if(chance(.5)){hurtD(d,ri(15,40));if(d.status==='home')lines.push(`${d.name}受了伤。`)}})}}
    else if(ev==='faqi'){const k=randFaqi(rollGrade(r,luck));addItem(G.bag,k);lines.push(pick(EXP_TXT.faqi).replace('{v}',itemInfo(k).name))}
    else if(ev==='ruin'){const g=Math.round(needP(r)*.1);addPXP(g);team.forEach(d=>addDXP(d,needXP(d.realm)*.1));lines.push(pick(EXP_TXT.ruin).replace('{v}',g)+(team.length?`（${names}也有所领悟）`:''))}
    else if(ev==='trouble'){const j=Math.min(G.p.jade,ri(20,80));G.p.jade-=j;lines.push(pick(EXP_TXT.trouble).replace('{v}',j))}
    else if(ev==='meet'){const d=pick(grads);d.favor+=4;d.lastContact=dn(G.date);if(d.age>=18&&d.love>=40){addLove(d,3);addHeart(2,d)}clampD(d);logD(d,'在外偶遇师尊，喝了一夜酒。');lines.push(pick(EXP_TXT.meet).replace(/\{d\}/g,d.name))}
    else if(ev==='cand'){cands++;G.queue.push({k:'walkin',cand:genDisciple(),src:'explore'});lines.push(pick(EXP_TXT.cand))}}

  return{k:'msg',title:`${play?'游山玩水':'游历见闻'} · ${days}日`,html:`<ul class="dlog" style="max-height:none;font-size:14px">${lines.map(l=>`<li>${l}</li>`).join('')}</ul>`}}
// ================= 宗门差事 =================
const TASK_FIGHT=['剿灭山中作乱的妖王','追捕叛逃的外门弟子','清剿魔修据点','护送灵脉勘探队','镇压古墓尸变','驱逐盘踞矿山的妖兽','斩杀吃人的化形蛇妖','击退来犯的邪修'];
const TASK_DONATE=['捐修宗门大殿','资助贫寒外门弟子','捐建灵兽园新圈','为宗主寿辰献礼','修缮藏经阁','重铸护山大阵阵眼'];
const TASK_TIME=[['驻守北境烽火台',60,100],['远行送信至天剑宗',20,40],['修复护山大阵',10,30],['监考外门入门考核',3,7],['巡视宗门灵脉',10,20],['押运灵石去分舵',15,30],['代管藏经阁',20,40],['镇守秘境入口',30,60],['调查弟子失踪案',10,25,1],['安抚灵兽园暴动',3,10,1],['去凡间赈灾',20,40],['编修宗门典籍',40,80],['迎接他宗使团',5,10],['看守思过崖',30,90],['替宗主炼制贺礼',30,60],['给外门弟子讲课',7,14],['勘察新发现的灵脉',15,30,1],['护送凡间皇子回京',20,35,1],['清点宗门库房',5,12],['陪长老出使魔域',40,70,1]];
function genTasks(){const r=G.p.realm,out=[];const n=ri(3,5);for(let i=0;i<n;i++){const ty=wpick(['fight','donate','item','time'],k=>({fight:3,donate:2,item:2,time:4})[k]);
  if(ty==='fight'){const diff=clamp(r+ri(-5,6),5,44);out.push({ty,n:pick(TASK_FIGHT),days:ri(5,25),diff,kpi:4+Math.floor(diff/4),jade:15+diff*3})}
  else if(ty==='donate'){const cost=Math.round(ri(80,400)*(1+G.p.rank*.3)/10)*10;out.push({ty,n:pick(TASK_DONATE),days:1,cost,kpi:Math.round(cost/35),jade:0})}
  else if(ty==='item'){const g=Math.min(3,rollGrade(r));const k=chance(.75)?`p:${pick(['jq','jx','hy','pj'])}:${g}`:randFaqi(g);const c=k[0]==='f'?1:ri(1,2);out.push({ty,n:`上缴${itemInfo(k).name}${c>1?'×'+c:''}`,days:1,need:k,cnt:c,kpi:5+g*5+(k[0]==='f'?5:0),jade:10+g*15})}
  else{const t=pick(TASK_TIME);const days=ri(t[1],t[2]);out.push({ty,n:t[0],days,risky:!!t[3],diff:clamp(r-2,5,44),kpi:Math.round(days/6)+1,jade:days*2})}}G.tasks=out;G.taskMonth=G.date.y*12+G.date.m}
function taskReq(t){if(t.ty==='fight')return `推荐修为：${REALMS[t.diff]}（会动手，可能受伤）`;if(t.ty==='donate')return `需捐灵玉 ${t.cost}`;if(t.ty==='item')return `需上缴：${itemInfo(t.need).name}×${t.cnt}（现有 ${countItem(G.bag,t.need)}）`;return t.risky?'途中可能遇险':'安稳的差事'}
function taskOK(t){if(t.ty==='donate')return G.p.jade>=t.cost;if(t.ty==='item')return countItem(G.bag,t.need)>=t.cnt;return true}
function openTasks(){if(!G.tasks||G.taskMonth!==G.date.y*12+G.date.m)genTasks();
  modal({title:'宗门差事',html:`<p class="hint">差事每月初更换，接下即刻动身。</p><div class="acts">${G.tasks.length?G.tasks.map((t,i)=>{const miss=missedFest(t.days);return `<button class="act" ${taskOK(t)?'':'disabled'} onclick="takeTask(${i})"><b>${t.n}</b><em>${t.days}日</em><p>${taskReq(t)}<br>报酬：KPI +${t.kpi}${t.jade?`，灵玉 +${t.jade}`:''}${miss.length?`<br><span style="color:var(--cinnabar)">会错过：${miss.join('、')}</span>`:''}</p></button>`}).join(''):'<p class="hint">本月的差事都接完了。</p>'}</div>`,btns:[{t:'返回',fn:openActs}]})}
function takeTask(i){const t=G.tasks[i];if(!t||!taskOK(t))return;if(t.ty==='donate')G.p.jade-=t.cost;if(t.ty==='item')removeItem(G.bag,t.need,t.cnt);G.tasks.splice(i,1);doAct('task',{task:t,days:t.days})}
ACT_END.task=(days,o)=>{const t=o.task;let html=`<p class="prose">你接下「${t.n}」，历时${days}日。</p>`;let ok=true;
  if(t.ty==='fight'||(t.risky&&chance(.35))){const foe=basePow(t.diff||G.p.realm);if(chance(powCheck(pPower(),foe))){hurtP(ri(0,15));html+=`<p class="prose">${t.ty==='fight'?'一场恶战，你得胜而归。':'途中遇险，好在有惊无险。'}</p>`}else{ok=false;hurtP(ri(20,45));html+=`<p class="prose" style="color:var(--cinnabar)">${t.ty==='fight'?'对手远比情报里说的强，你负伤败退，差事没能办成。':'途中遭遇伏击，你负伤脱身，差事只办成了一半。'}</p>`}}
  if(G.over)return null;const k=ok?t.kpi:(t.ty==='fight'?0:Math.floor(t.kpi/2)),j=ok?t.jade:Math.floor(t.jade/2);G.p.kpi+=k;G.p.jade+=j;log(`宗门差事「${t.n}」${ok?'完成':'未竟'}。`);
  return{k:'msg',title:ok?'差事完成':'差事受挫',html:html+`<p class="hint">KPI +${k}${j?`，灵玉 +${j}`:''}</p>`}};

ENDINGS.ice={t:'冰棺',s:d=>`你倒在${d.name}的剑下。<br><br>${TA(d)}接住了你，抱了很久很久，久到你的身体一点点凉下去。<br><br>后来有人说，${d.status==='demon'?'魔域最深处的宫殿里':'极北的冰原之下'}，有一口万年玄冰雕成的棺。棺中的人容颜如生，像只是睡着了。<br>棺旁永远坐着一个人，每天替棺中人梳一次头发，说一会儿话。<br><br>“师尊，这样你就哪儿也去不了了。”`};
